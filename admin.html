<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - TNXUS CLUB</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: '#165DFF',
        success: '#00B42A',
        warning: '#FF7D00',
        danger: '#F53F3F',
        neutral: '#86909C'
      }
    }
  }
}
</script>
<style>
body{background:#F7F8FA}
.card{background:white;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.btn{padding:10px 16px;border-radius:8px;font-weight:500;border:none;cursor:pointer}
.btn-primary{background:#165DFF;color:white}
.btn-success{background:#00B42A;color:white}
.btn-danger{background:#F53F3F;color:white}
.btn-warning{background:#FF7D00;color:white}
.btn-sm{padding:6px 10px;font-size:13px}
input,select,textarea{width:100%;padding:12px;border:1px solid #E5E6EB;border-radius:8px;margin-bottom:12px;outline:none}
input:focus,select:focus{border-color:#165DFF}
.badge{padding:4px 8px;border-radius:4px;font-size:12px;font-weight:500}
.badge-wait{background:#FFF7E8;color:#FF7D00}
.badge-pending{background:#E8F3FF;color:#165DFF}
.badge-success{background:#E8FFEA;color:#00B42A}
.badge-danger{background:#FFECE8;color:#F53F3F}
.tab{padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent}
.tab.active{border-bottom-color:#165DFF;color:#165DFF;font-weight:600}
.page{display:none}
.page.active{display:block}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px;text-align:left;border-bottom:1px solid #F2F3F5}
th{background:#F7F8FA;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:200}
.modal.active{display:flex}
.modal-content{background:white;border-radius:12px;padding:24px;margin:16px;max-width:500px;width:100%}
</style>
</head>
<body class="p-4 max-w-7xl mx-auto">

<!-- LAYAR LOGIN ADMIN -->
<div id="loginAdmin" class="min-h-screen flex items-center justify-center">
  <div class="card w-full max-w-md">
    <h2 class="text-xl font-bold text-center mb-6">🔐 Panel Admin TNXUS CLUB</h2>
    <input type="text" id="userAdmin" placeholder="Username Admin">
    <input type="password" id="passAdmin" placeholder="Kata Sandi">
    <button class="btn btn-primary w-full" onclick="loginAdmin()">Masuk Panel</button>
  </div>
</div>

<!-- PANEL ADMIN -->
<div id="panelAdmin" class="hidden">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-xl font-bold">Panel Admin TNXUS CLUB</h1>
    <button class="btn btn-sm btn-danger" onclick="keluarAdmin()">Keluar</button>
  </div>

  <!-- TAB MENU -->
  <div class="flex mb-6 border-b">
    <div class="tab active" data-page="transaksi">Verifikasi Masuk</div>
    <div class="tab" data-page="penarikan">Verifikasi Tarik</div>
    <div class="tab" data-page="afiliator">Data Afiliator</div>
    <div class="tab" data-page="grafik">Grafik</div>
    <div class="tab" data-page="tambah">Tambah Data</div>
  </div>

  <!-- PAGE: VERIFIKASI TRANSAKSI MASUK -->
  <div id="page-transaksi" class="page active">
    <h3 class="font-bold mb-4">Verifikasi Saldo Masuk</h3>
    <div id="daftarTransaksi"></div>
  </div>

  <!-- PAGE: VERIFIKASI PENARIKAN -->
  <div id="page-penarikan" class="page">
    <h3 class="font-bold mb-4">Verifikasi Penarikan Saldo</h3>
    <div id="daftarPenarikan"></div>
  </div>

  <!-- PAGE: DATA AFILIATOR -->
  <div id="page-afiliator" class="page">
    <h3 class="font-bold mb-4">Daftar Afiliator</h3>
    <div id="daftarAfiliator"></div>
  </div>

  <!-- PAGE: GRAFIK -->
  <div id="page-grafik" class="page">
    <h3 class="font-bold mb-4">Grafik Transaksi 30 Hari Terakhir</h3>
    <div class="card">
      <canvas id="grafikChart" height="300"></canvas>
    </div>
  </div>

  <!-- PAGE: TAMBAH DATA -->
  <div id="page-tambah" class="page">
    <h3 class="font-bold mb-4">Tambah Data Transaksi</h3>
    <div class="card">
      <label class="block mb-1 font-medium">Username Afiliasi</label>
      <input type="text" id="tambahUser" placeholder="username">
      
      <label class="block mb-1 font-medium">Nominal (Rp)</label>
      <input type="number" id="tambahNominal" placeholder="0">
      
      <label class="block mb-1 font-medium">Keterangan</label>
      <input type="text" id="tambahKeterangan" placeholder="Contoh: Komisi Pesanan #123">
      
      <button class="btn btn-primary w-full" onclick="tambahTransaksi()">Simpan Transaksi</button>
    </div>
  </div>
</div>

<script>
// === KONFIGURASI ===
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbz8SFQlK4QW_TDKsQL-Ye1yGvXycuN5mMyKX437zoDFLYWgqd8001DANfc-E8h17yNN2A/exec'; // Sama dengan user
let sesiAdmin = JSON.parse(localStorage.getItem('sesiAdmin') || 'null');
let grafik = null;

// === INISIALISASI ===
cekSesiAdmin();
setInterval(cekSesiAdmin, 3600000);
setInterval(muatSemuaData, 10000);

// === TAB NAVIGASI ===
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('page-' + tab.dataset.page).classList.add('active');
    if(tab.dataset.page === 'grafik') muatGrafik();
  });
});

// === FUNGSI ADMIN ===
function cekSesiAdmin(){
  if(!sesiAdmin){
    document.getElementById('loginAdmin').classList.remove('hidden');
    document.getElementById('panelAdmin').classList.add('hidden');
    return;
  }
  const lalu = new Date(sesiAdmin.masukPada);
  if((new Date() - lalu) > 30*24*60*60*1000){
    localStorage.removeItem('sesiAdmin');
    sesiAdmin = null;
    return;
  }
  document.getElementById('loginAdmin').classList.add('hidden');
  document.getElementById('panelAdmin').classList.remove('hidden');
  muatSemuaData();
}

async function loginAdmin(){
  const user = document.getElementById('userAdmin').value.trim();
  const pass = document.getElementById('passAdmin').value;
  
  const res = await fetch(SHEET_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({aksi:'loginAdmin', username:user, password:pass})
  });
  const data = await res.json();
  if(data.sukses){
    sesiAdmin = {nama: data.nama, masukPada: new Date().toISOString()};
    localStorage.setItem('sesiAdmin', JSON.stringify(sesiAdmin));
    cekSesiAdmin();
  }else{
    alert('Login gagal! Periksa username & password');
  }
}

function keluarAdmin(){
  localStorage.removeItem('sesiAdmin');
  sesiAdmin = null;
  cekSesiAdmin();
}

async function muatSemuaData(){
  if(!sesiAdmin) return;
  
  // Transaksi masuk menunggu
  const r1 = await fetch(SHEET_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({aksi:'daftarTransaksiMasuk'})
  });
  const d1 = await r1.json();
  tampilTransaksi(d1.data || []);
  
  // Penarikan menunggu
  const r2 = await fetch(SHEET_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({aksi:'daftarPenarikan'})
  });
  const d2 = await r2.json();
  tampilPenarikan(d2.data || []);
  
  // Afiliator
  const r3 = await fetch(SHEET_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({aksi:'daftarAfiliator'})
  });
  const d3 = await r3.json();
  tampilAfiliator(d3.data || []);
}

function tampilTransaksi(list){
  const el = document.getElementById('daftarTransaksi');
  const menunggu = list.filter(i => i.status === 'menunggu');
  el.innerHTML = menunggu.length ? `
    <div class="overflow-x-auto">
      <table>
        <thead>
          <tr>
            <th>Tanggal</th>
            <th>Afiliasi</th>
            <th>Nominal</th>
            <th>Keterangan</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody>
          ${menunggu.map(item => `
            <tr>
              <td>${item.tanggal}</td>
              <td>${item.username}</td>
              <td>${formatRupiah(item.nominal)}</td>
              <td>${item.keterangan || '-'}</td>
              <td>
                <button class="btn btn-sm btn-success mr-1" onclick="verifikasiMasuk('${item.id}','disetujui')">Setujui</button>
                <button class="btn btn-sm btn-danger" onclick="verifikasiMasuk('${item.id}','ditolak')">Tolak</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  ` : '<p class="text-gray-500 text-center py-4">Tidak ada transaksi menunggu verifikasi</p>';
}

async function verifikasiMasuk(id, status){
  if(!confirm(`Yakin ingin ${status==='disetujui'?'menyetujui':'menolak'} transaksi ini?`)) return;
  const res = await fetch(SHEET_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({aksi:'verifikasiMasuk', id, status, admin: sesiAdmin.nama})
  });
  const d = await res.json();
  if(d.sukses) muatSemuaData();
  alert(d.pesan);
}

function tampilPenarikan(list){
  const el = document.getElementById('daftarPenarikan');
  const menunggu = list.filter(i => i.status === 'menunggu' || i.status === 'diproses');
  el.innerHTML = menunggu.length ? `
    <div class="overflow-x-auto">
      <table>
        <thead>
          <tr>
            <th>Tanggal</th>
            <th>Afiliasi</th>
            <th>Nominal</th>
            <th>Tujuan</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody>
          ${menunggu.map(item => `
            <tr>
              <td>${item.tanggal}</td>
              <td>${item.username}</td>
              <td>${formatRupiah(item.nominal)}</td>
              <td>${item.metode}: ${item.nomor_tujuan}<br><small>${item.nama_pemilik}</small></td>
              <td><span class="badge badge-wait">${item.status}</span></td>
              <td>
                <button class="btn btn-sm btn-success mr-1" onclick="ubahStatusTarik('${item.id}','berhasil')">Berhasil</button>
                <button class="btn btn-sm btn-danger" onclick="ubahStatusTarik('${item.id}','gagal')">Gagal</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  ` : '<p class="text-gray-500 text-center py-4">Tidak ada penarikan menunggu verifikasi</p>';
}

async function ubahStatusTarik(id, status){
  if(!confirm(`Ubah status menjadi ${status}?`)) return;
  const res = await fetch(SHEET_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({aksi:'ubahStatusTarik', id, status})
  });
  const d = await res.json();
  if(d.sukses) muatSemuaData();
  alert(d.pesan);
}

function tampilAfiliator(list){
  const el = document.getElementById('daftarAfiliator');
  el.innerHTML = list.length ? `
    <div class="overflow-x-auto">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nama</th>
            <th>Username</th>
            <th>HP</th>
            <th>Saldo Tersedia</th>
            <th>Saldo Pending</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody>
          ${list.map(item => `
            <tr>
              <td>${item.id_afiliasi}</td>
              <td>${item.nama}</td>
              <td>${item.username}</td>
              <td>${item.no_hp}</td>
              <td>${formatRupiah(item.saldo_tersedia)}</td>
              <td>${formatRupiah(item.saldo_pending)}</td>
              <td><span class="badge ${item.status==='aktif'?'badge-success':'badge-danger'}">${item.status}</span></td>
              <td>
                <button class="btn btn-sm ${item.status==='aktif'?'btn-danger':'btn-success'}" 
                  onclick="toggleStatusAfiliator('${item.username}','${item.status==='aktif'?'nonaktif':'aktif'}')">
                  ${item.status==='aktif'?'Nonaktifkan':'Aktifkan'}
                </button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  ` : '<p class="text-gray-500 text-center py-4">Belum ada data afiliator</p>';
}

async function toggleStatusAfiliator(username, status){
  const res = await fetch(SHEET_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({aksi:'ubahStatusAfiliator', username, status})
  });
  const d = await res.json();
  if(d.sukses) muatSemuaData();
  alert(d.pesan);
}

async function tambahTransaksi(){
  const user = document.getElementById('tambahUser').value.trim();
  const nominal = parseInt(document.getElementById('tambahNominal').value);
  const keterangan = document.getElementById('tambahKeterangan').value.trim();
  
  if(!user || !nominal) return alert('Lengkapi data!');
  
  const res = await fetch(SHEET_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({aksi:'tambahTransaksiManual', username: user, nominal, keterangan})
  });
  const d = await res.json();
  if(d.sukses){
    alert('Transaksi berhasil ditambahkan!');
    document.getElementById('tambahUser').value = '';
    document.getElementById('tambahNominal').value = '';
    document.getElementById('tambahKeterangan').value = '';
    muatSemuaData();
  }else{
    alert(d.pesan);
  }
}

async function muatGrafik(){
  const res = await fetch(SHEET_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({aksi:'dataGrafik'})
  });
  const d = await res.json();
  
  if(grafik) grafik.destroy();
  
  const ctx = document.getElementById('grafikChart').getContext('2d');
  grafik = new Chart(ctx, {
    type: 'line',
    data: {
      labels: d.tanggal || [],
      datasets: [{
        label: 'Total Masuk Harian',
        data: d.nominal || [],
        borderColor: '#165DFF',
        backgroundColor: 'rgba(22,93,255,0.1)',
        fill: true,
        tension: 0.4
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { position: 'top' } },
      scales: { y: { beginAtZero: true } }
    }
  });
}

function formatRupiah(angka){
  return 'Rp ' + parseInt(angka || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}
</script>
</body>
</html>
