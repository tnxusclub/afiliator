<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - TNXUS CLUB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#4f46e5',
            success: '#10b981',
            warning: '#f59e0b',
            danger: '#ef4444',
            dark: '#1e293b'
          }
        }
      }
    }
  </script>
  <style>
    .gradient { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
    .card { box-shadow: 0 4px 20px rgba(79, 70, 229, 0.1); }
    .muncul { animation: muncul 0.3s ease-out; }
    @keyframes muncul { from {opacity:0; transform:translateY(10px)} to {opacity:1; transform:translateY(0)} }
  </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
  <div id="app" class="max-w-5xl mx-auto p-4">
    <!-- LOGIN ADMIN -->
    <div id="hal_login" class="flex items-center justify-center min-h-screen">
      <div class="bg-white rounded-2xl p-8 w-full max-w-md card muncul">
        <div class="text-center mb-6">
          <div class="w-16 h-16 gradient rounded-xl mx-auto flex items-center justify-center mb-3">
            <i class="fa fa-shield text-white text-2xl"></i>
          </div>
          <h1 class="text-2xl font-bold text-dark">Admin Panel</h1>
          <p class="text-gray-500">TNXUS CLUB Afiliasi</p>
        </div>
        <div class="space-y-4">
          <input type="text" id="adm_user" placeholder="Username Admin" class="w-full p-3 border rounded-xl">
          <input type="password" id="adm_pass" placeholder="Password" class="w-full p-3 border rounded-xl">
          <button onclick="masukAdmin()" class="w-full gradient text-white p-3 rounded-xl font-medium">Masuk Panel</button>
        </div>
      </div>
    </div>

    <!-- PANEL UTAMA -->
    <div id="hal_panel" class="hidden muncul">
      <div class="gradient text-white p-5 rounded-2xl mb-6 flex justify-between items-center">
        <div>
          <h1 class="text-xl font-bold">Dashboard Admin</h1>
          <p class="text-white/70 text-sm">Kelola sistem afiliasi</p>
        </div>
        <button onclick="keluarAdmin()" class="bg-white/20 p-2 rounded-lg hover:bg-white/30 transition">
          <i class="fa fa-sign-out"></i>
        </button>
      </div>

      <!-- MENU TAB -->
      <div class="flex flex-wrap gap-2 mb-6">
        <button class="tab-btn active bg-primary text-white px-4 py-2 rounded-lg" data-tab="pengajuan">Pengajuan Akun</button>
        <button class="tab-btn bg-gray-200 px-4 py-2 rounded-lg" data-tab="afiliator">Daftar Afiliator</button>
        <button class="tab-btn bg-gray-200 px-4 py-2 rounded-lg" data-tab="penarikan">Penarikan Saldo</button>
        <button class="tab-btn bg-gray-200 px-4 py-2 rounded-lg" data-tab="verifikasi">Verifikasi Masuk</button>
      </div>

      <!-- KONTEN TAB -->
      <div id="tab_pengajuan" class="tab-konten">
        <h2 class="font-bold text-lg mb-3">Pengajuan Afiliator Baru</h2>
        <div id="daftar_pengajuan" class="space-y-3">
          <p class="text-gray-500 text-center py-4">Memuat data...</p>
        </div>
      </div>

      <div id="tab_afiliator" class="tab-konten hidden">
        <h2 class="font-bold text-lg mb-3">Daftar Semua Afiliator</h2>
        <div id="daftar_afiliator" class="space-y-3">
          <p class="text-gray-500 text-center py-4">Memuat data...</p>
        </div>
      </div>

      <div id="tab_penarikan" class="tab-konten hidden">
        <h2 class="font-bold text-lg mb-3">Pengajuan Penarikan</h2>
        <div id="daftar_penarikan" class="space-y-3">
          <p class="text-gray-500 text-center py-4">Memuat data...</p>
        </div>
      </div>

      <div id="tab_verifikasi" class="tab-konten hidden">
        <h2 class="font-bold text-lg mb-3">Verifikasi Saldo Masuk</h2>
        <div class="bg-white p-4 rounded-xl card mb-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <input type="text" id="ver_id_afiliasi" placeholder="ID Afiliasi" class="p-3 border rounded-lg">
            <input type="number" id="ver_nominal" placeholder="Nominal Masuk" class="p-3 border rounded-lg">
          </div>
          <div class="flex gap-3 mt-3">
            <button onclick="setujuiMasuk()" class="flex-1 bg-success text-white p-2 rounded-lg">Setujui & Masukkan ke Saldo</button>
            <button onclick="tolakMasuk()" class="flex-1 bg-danger text-white p-2 rounded-lg">Tolak</button>
          </div>
        </div>
      </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 bg-dark text-white px-6 py-3 rounded-full shadow-lg z-50 transition-all duration-300 opacity-0 -translate-y-4 pointer-events-none"></div>
  </div>

  <script>
    // GANTI DENGAN URL DEPLOY APPS SCRIPT KAMU
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbwaQDS2SzdIzfdTf58KfZE5eIs45y3p0pVcyxfFn00YYME8PYoWDSfJzRPFm13Cdxdxdg/exec";
    
    let sesiAdmin = false;

    cekSesi();

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => {
          b.classList.remove('active', 'bg-primary', 'text-white');
          b.classList.add('bg-gray-200');
        });
        btn.classList.add('active', 'bg-primary', 'text-white');
        btn.classList.remove('bg-gray-200');
        
        document.querySelectorAll('.tab-konten').forEach(k => k.classList.add('hidden'));
        document.getElementById(`tab_${btn.dataset.tab}`).classList.remove('hidden');
        
        if(btn.dataset.tab === 'pengajuan') muatPengajuan();
        if(btn.dataset.tab === 'afiliator') muatAfiliator();
        if(btn.dataset.tab === 'penarikan') muatPenarikan();
      });
    });

    function cekSesi() {
      const simpanan = localStorage.getItem("admin_sesi");
      if(!simpanan) return;
      const {status, waktu} = JSON.parse(simpanan);
      if(status === 'ok' && Date.now() - waktu < 30 * 24 * 60 * 60 * 1000) {
        sesiAdmin = true;
        tampilPanel();
      }
    }

    async function masukAdmin() {
      const user = document.getElementById('adm_user').value;
      const pass = document.getElementById('adm_pass').value;
      const res = await kirim({aksi: 'admin_login', username: user, password: pass});
      if(res.status === 'sukses') {
        sesiAdmin = true;
        localStorage.setItem("admin_sesi", JSON.stringify({status: 'ok', waktu: Date.now()}));
        tampilPanel();
      } else pesan(res.pesan || 'Login gagal');
    }

    function tampilPanel() {
      document.getElementById('hal_login').classList.add('hidden');
      document.getElementById('hal_panel').classList.remove('hidden');
      muatPengajuan();
    }

    function keluarAdmin() {
      localStorage.removeItem("admin_sesi");
      sesiAdmin = false;
      document.getElementById('hal_panel').classList.add('hidden');
      document.getElementById('hal_login').classList.remove('hidden');
    }

    async function muatPengajuan() {
      const res = await kirim({aksi: 'daftar_pengajuan'});
      const el = document.getElementById('daftar_pengajuan');
      if(res.data.length === 0) {
        el.innerHTML = '<p class="text-gray-500 text-center py-4">Tidak ada pengajuan baru ✅</p>';
        return;
      }
      el.innerHTML = res.data.map(d => `
        <div class="bg-white p-4 rounded-xl card">
          <div class="grid grid-cols-2 gap-2 mb-3">
            <div><p class="text-xs text-gray-500">Nama</p><p class="font-medium">${d.nama}</p></div>
            <div><p class="text-xs text-gray-500">No HP</p><p class="font-medium">${d.no_hp}</p></div>
            <div><p class="text-xs text-gray-500">Username</p><p class="font-medium">${d.username}</p></div>
            <div><p class="text-xs text-gray-500">Dikirim</p><p class="font-medium text-sm">${new Date(d.waktu).toLocaleDateString('id-ID')}</p></div>
          </div>
          <div class="flex gap-2">
            <button onclick="terima('${d.id}')" class="flex-1 bg-success text-white p-2 rounded-lg">Terima</button>
            <button onclick="tolak('${d.id}')" class="flex-1 bg-danger text-white p-2 rounded-lg">Tolak</button>
          </div>
        </div>
      `).join('');
    }

    async function terima(id) {
      const res = await kirim({aksi: 'terima_afiliator', id});
      pesan(res.status === 'sukses' ? 'Disetujui ✅' : 'Gagal');
      muatPengajuan();
    }

    async function tolak(id) {
      if(!confirm('Yakin menolak? Data akan dihapus')) return;
      const res = await kirim({aksi: 'tolak_afiliator', id});
      pesan(res.status === 'sukses' ? 'Ditolak & dihapus' : 'Gagal');
      muatPengajuan();
    }

    async function muatAfiliator() {
      const res = await kirim({aksi: 'daftar_afiliator'});
      const el = document.getElementById('daftar_afiliator');
      el.innerHTML = res.data.length === 0 ? '<p class="text-gray-500 text-center py-4">Belum ada afiliator</p>' :
        res.data.map(d => `
          <div class="bg-white p-4 rounded-xl card flex justify-between items-center">
            <div>
              <p class="font-bold">${d.nama}</p>
                            <p class="text-sm text-gray-500">${d.id_afiliasi} | ${d.no_hp}</p>
              <span class="inline-block mt-1 px-2 py-1 rounded text-xs ${d.status === 'aktif' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${d.status}</span>
            </div>
            <button onclick="gantiStatus('${d.id_afiliasi}', '${d.status === 'aktif' ? 'nonaktif' : 'aktif'}')" 
              class="px-3 py-2 rounded-lg text-sm font-medium ${d.status === 'aktif' ? 'bg-yellow-100 text-yellow-700' : 'bg-green-100 text-green-700'}">
              ${d.status === 'aktif' ? 'Nonaktifkan' : 'Aktifkan'}
            </button>
          </div>
        `).join('');
    }

    async function gantiStatus(idAfiliasi, statusBaru) {
      const res = await kirim({aksi: 'ubah_status_afiliator', id_afiliasi: idAfiliasi, status: statusBaru});
      pesan(res.status === 'sukses' ? 'Status diperbarui ✅' : 'Gagal mengubah status');
      muatAfiliator();
    }

    async function muatPenarikan() {
      const res = await kirim({aksi: 'daftar_penarikan'});
      const el = document.getElementById('daftar_penarikan');
      if (res.data.length === 0) {
        el.innerHTML = '<p class="text-gray-500 text-center py-4">Belum ada pengajuan penarikan</p>';
        return;
      }
      el.innerHTML = res.data.map(d => {
        let tombol = '';
        if (d.status === 'menunggu') {
          tombol = `
            <div class="flex gap-2 mt-3">
              <button onclick="prosesTarik('${d.id}')" class="flex-1 bg-blue-500 text-white p-2 rounded-lg">Proses</button>
              <button onclick="gagalTarik('${d.id}')" class="flex-1 bg-red-500 text-white p-2 rounded-lg">Gagal</button>
            </div>
          `;
        } else if (d.status === 'memproses') {
          tombol = `
            <div class="mt-3">
              <button onclick="berhasilTarik('${d.id}')" class="w-full bg-green-500 text-white p-2 rounded-lg">Tandai Berhasil</button>
            </div>
          `;
        } else if (d.status === 'berhasil') {
          tombol = `<span class="text-green-600 font-medium mt-2 inline-block">✅ Berhasil</span>`;
        } else if (d.status === 'gagal') {
          tombol = `<span class="text-red-600 font-medium mt-2 inline-block">❌ Gagal — saldo dikembalikan</span>`;
        }

        return `
          <div class="bg-white p-4 rounded-xl card">
            <div class="grid grid-cols-2 gap-2">
              <div><p class="text-xs text-gray-500">ID Afiliasi</p><p class="font-medium">${d.id_afiliasi}</p></div>
              <div><p class="text-xs text-gray-500">Nominal</p><p class="font-bold text-primary">Rp ${parseInt(d.nominal).toLocaleString('id-ID')}</p></div>
              <div><p class="text-xs text-gray-500">Metode</p><p class="font-medium">${d.metode}</p></div>
              <div><p class="text-xs text-gray-500">Tujuan</p><p class="font-medium">${d.nomor_tujuan} a.n ${d.nama_pemilik}</p></div>
              <div class="col-span-2"><p class="text-xs text-gray-500">Status</p><p class="font-medium">${d.status}</p></div>
            </div>
            ${tombol}
          </div>
        `;
      }).join('');
    }

    async function prosesTarik(id) {
      const res = await kirim({aksi: 'setujui_tarik', id: id});
      pesan(res.status === 'sukses' ? 'Status: Memproses' : 'Gagal');
      muatPenarikan();
    }

    async function berhasilTarik(id) {
      const res = await kirim({aksi: 'tandai_berhasil', id: id});
      pesan(res.status === 'sukses' ? 'Ditandai Berhasil ✅' : 'Gagal');
      muatPenarikan();
    }

    async function gagalTarik(id) {
      if (!confirm('Yakin tandai sebagai Gagal? Saldo akan dikembalikan ke akun afiliasi')) return;
      const res = await kirim({aksi: 'tandai_gagal', id: id});
      pesan(res.status === 'sukses' ? 'Dibatalkan — saldo dikembalikan' : 'Gagal');
      muatPenarikan();
    }

    async function setujuiMasuk() {
      const idAfiliasi = document.getElementById('ver_id_afiliasi').value;
      const nominal = parseInt(document.getElementById('ver_nominal').value);
      if (!idAfiliasi || !nominal || nominal <= 0) return pesan('Lengkapi data dengan benar');
      
      const res = await kirim({
        aksi: 'verifikasi_masuk',
        id_afiliasi: idAfiliasi,
        nominal: nominal,
        setuju: true
      });
      
      pesan(res.status === 'sukses' ? 'Saldo berhasil ditambahkan ✅' : 'Gagal memproses');
      document.getElementById('ver_id_afiliasi').value = '';
      document.getElementById('ver_nominal').value = '';
    }

    async function tolakMasuk() {
      const idAfiliasi = document.getElementById('ver_id_afiliasi').value;
      const nominal = parseInt(document.getElementById('ver_nominal').value);
      if (!idAfiliasi || !nominal || nominal <= 0) return pesan('Lengkapi data dengan benar');
      
      const res = await kirim({
        aksi: 'verifikasi_masuk',
        id_afiliasi: idAfiliasi,
        nominal: nominal,
        setuju: false
      });
      
      pesan(res.status === 'sukses' ? 'Ditolak ✅' : 'Gagal');
      document.getElementById('ver_id_afiliasi').value = '';
      document.getElementById('ver_nominal').value = '';
    }

    function pesan(teks) {
      const el = document.getElementById('toast');
      el.textContent = teks;
      el.classList.remove('opacity-0', '-translate-y-4');
      setTimeout(() => el.classList.add('opacity-0', '-translate-y-4'), 3000);
    }

    async function kirim(data) {
      try {
        const res = await fetch(URL_SCRIPT, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(data)
        });
        return await res.json();
      } catch (e) {
        return {status: 'error', pesan: 'Koneksi gagal — cek URL deploy'};
      }
    }
  </script>
</body>
</html>
