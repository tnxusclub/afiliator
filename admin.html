<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Sistem Afiliasi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#165DFF',
            dark: '#0F172A',
            success: '#10B981',
            warning: '#F59E0B',
            danger: '#EF4444',
            admin: '#1E293B'
          }
        }
      }
    }
  </script>
  <style>
    .page { padding: 1rem; max-width: 1200px; margin: 0 auto; }
    .card { @apply bg-white rounded-xl shadow-sm p-4 mb-4; }
    .btn { @apply px-3 py-2 rounded-lg font-medium text-sm transition-all active:scale-95; }
    .btn-primary { @apply bg-primary text-white; }
    .btn-success { @apply bg-success text-white; }
    .btn-danger { @apply bg-danger text-white; }
    .btn-warning { @apply bg-warning text-white; }
    .tab { @apply px-4 py-2 font-medium border-b-2 border-transparent; }
    .tab.active { @apply border-primary text-primary; }
    table { @apply w-full text-sm; }
    th { @apply text-left py-2 px-2 bg-slate-50 font-semibold; }
    td { @apply py-2 px-2 border-t; }
  </style>
</head>
<body class="bg-slate-50 text-dark min-h-screen">
  <div id="app"></div>
  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzkzATwk2Qk6pXLZcFV0kvyaOdJ7CmNQvHRNP6P89vKMr6OEpn9h_dCqKjXGgObV5KcyQ/exec';
    const SESSION_KEY = 'admin_session';
    const EXPIRE_DAY = 30;

    let state = { halaman:'login', tab:'pengajuan', data:{} };

    function cekSesi() {
      const s = localStorage.getItem(SESSION_KEY);
      if (!s) return false;
      const {waktu} = JSON.parse(s);
      if (Date.now() - waktu > EXPIRE_DAY*86400000) { localStorage.removeItem(SESSION_KEY); return false; }
      return true;
    }

    async function api(action, p={}) {
      const u = new URLSearchParams({action, ...p});
      const r = await fetch(SCRIPT_URL+'?'+u);
      return r.json();
    }

    function masuk() { localStorage.setItem(SESSION_KEY, JSON.stringify({waktu:Date.now()})); render(); }
    function keluar() { localStorage.removeItem(SESSION_KEY); state.halaman='login'; render(); }

    // Login
    function renderLogin() {
      return `
      <div class="min-h-screen flex items-center justify-center p-4 bg-admin">
        <div class="w-full max-w-md">
          <h1 class="text-2xl font-bold text-white text-center mb-8">Panel Admin</h1>
          <div class="card">
            <div id="err" class="text-red-500 text-sm mb-3"></div>
            <input type="text" id="u" placeholder="Username" class="w-full px-4 py-2 border rounded-lg mb-3">
            <input type="password" id="p" placeholder="Password" class="w-full px-4 py-2 border rounded-lg mb-4">
            <button onclick="prosesLogin()" class="btn btn-primary w-full">Masuk</button>
          </div>
        </div>
      </div>`;
    }

    async function prosesLogin() {
      const u = document.getElementById('u').value;
      const p = document.getElementById('p').value;
      const res = await api('adminLogin', {u, p});
      if (!res.sukses) return document.getElementById('err').textContent = res.pesan;
      masuk();
    }

    // Nav Tab
    function tabs() {
      return `
      <div class="flex overflow-x-auto border-b mb-4 sticky top-0 bg-white z-10">
        <button onclick="state.tab='pengajuan';render()" class="tab ${state.tab==='pengajuan'?'active':''}">Pengajuan Akun</button>
        <button onclick="state.tab='afiliator';render()" class="tab ${state.tab==='afiliator'?'active':''}">Daftar Afiliator</button>
        <button onclick="state.tab='transaksi';render()" class="tab ${state.tab==='transaksi'?'active':''}">Verifikasi Transaksi</button>
        <button onclick="keluar()" class="tab ml-auto text-danger">Keluar</button>
      </div>`;
    }

    // Pengajuan Akun
    async function muatPengajuan() {
      state.data.pengajuan = (await api('getDaftarPengajuan')).data;
      render();
    }

    function renderPengajuan() {
      if (!state.data.pengajuan) muatPengajuan();
      const d = state.data.pengajuan || [];
      return `
      <div class="page">
        <h2 class="text-xl font-bold mb-4">Pengajuan Afiliasi Baru</h2>
        ${d.length?`
        <div class="overflow-x-auto">
          <table class="card">
            <tr><th>Nama</th><th>HP</th><th>Username</th><th>Tgl Daftar</th><th>Aksi</th></tr>
            ${d.map(x=>`
            <tr>
              <td>${x.nama}</td><td>${x.hp}</td><td>${x.user}</td><td>${new Date(x.tgl).toLocaleDateString()}</td>
              <td>
                <button onclick="terima(${x.idx})" class="btn btn-success mr-1">Terima</button>
                <button onclick="tolak(${x.idx})" class="btn btn-danger">Tolak</button>
              </td>
            </tr>`).join('')}
          </table>
        </div>`:'<p class="text-gray-500">Tidak ada pengajuan baru</p>'}
      </div>`;
    }

    async function terima(i) {
      if (!confirm('Terima akun ini?')) return;
      await api('terimaPengajuan', {idx:i}); muatPengajuan();
    }
    async function tolak(i) {
      if (!confirm('Tolak & hapus data ini?')) return;
      await api('tolakPengajuan', {idx:i}); muatPengajuan();
    }

    // Daftar Afiliator
    async function muatAfiliator() {
      state.data.afiliator = (await api('getDaftarAfiliator')).data;
      render();
    }

    function renderAfiliator() {
      if (!state.data.afiliator) muatAfiliator();
      const d = state.data.afiliator || [];
      return `
      <div class="page">
        <h2 class="text-xl font-bold mb-4">Daftar Afiliator</h2>
        <div class="overflow-x-auto">
          <table class="card">
            <tr><th>ID</th><th>Nama</th><th>HP</th><th>Status</th><th>Aksi</th></tr>
            ${d.map(x=>`
            <tr>
              <td>${x.id_afiliasi}</td><td>${x.nama}</td><td>${x.hp}</td>
              <td><span class="px-2 py-1 rounded-full text-xs ${x.status==='aktif'?'bg-green-100 text-green-700':'bg-red-100 text-red-700'}">${x.status}</span></td>
              <td>
                <button onclick="toggleStatus(${x.idx})" class="btn ${x.status==='aktif'?'btn-danger':'btn-success'}">
                  ${x.status==='aktif'?'Nonaktifkan':'Aktifkan'}
                </button>
              </td>
            </tr>`).join('')}
          </table>
        </div>
      </div>`;
    }

    async function toggleStatus(i) {
      await api('toggleStatusAfiliator', {idx:i}); muatAfiliator();
    }

    // Transaksi
    async function muatTransaksi() {
      state.data.transaksi = (await api('getTransaksi')).data;
      render();
    }

    function renderTransaksi() {
      if (!state.data.transaksi) muatTransaksi();
      const d = state.data.transaksi || [];
      return `
      <div class="page">
        <h2 class="text-xl font-bold mb-4">Verifikasi Transaksi</h2>
        <div class="overflow-x-auto">
          <table class="card">
            <tr><th>ID Trx</th><th>ID Afiliasi</th><th>Jenis</th><th>Nominal</th><th>Status</th><th>Tindakan</th></tr>
            ${d.map(x=>`
            <tr>
              <td class="font-mono text-xs">${x.id}</td>
              <td>${x.id_afiliasi}</td>
              <td><span class="${x.jenis==='masuk'?'text-success':'text-danger'}">${x.jenis}</span></td>
              <td>Rp${Number(x.nominal).toLocaleString()}</td>
              <td><span class="px-2 py-1 rounded-full text-xs ${
                x.status==='berhasil'?'bg-green-100 text-green-700':
                x.status==='menunggu verifikasi'?'bg-yellow-100 text-yellow-700':
                x.status==='memproses'?'bg-blue-100 text-blue-700':'bg-gray-100 text-gray-700'
              }">${x.status}</span></td>
              <td>
                ${x.jenis==='masuk' && x.status==='menunggu verifikasi'?`
                  <button onclick="verifMasuk('${x.id}','setuju')" class="btn btn-success mr-1">Setujui</button>
                  <button onclick="verifMasuk('${x.id}','tolak')" class="btn btn-danger">Tolak</button>
                `:''}
                ${x.jenis==='tarik' && x.status==='menunggu verifikasi'?`
                  <button onclick="verifTarik('${x.id}','proses')" class="btn btn-primary mr-1">Proses</button>
                  <button onclick="verifTarik('${x.id}','gagal')" class="btn btn-danger">Gagal</button>
                `:''}
                                ${x.jenis==='tarik' && x.status==='memproses'?`
                  <button onclick="verifTarik('${x.id}','berhasil')" class="btn btn-success mr-1">Berhasil</button>
                  <button onclick="verifTarik('${x.id}','gagal')" class="btn btn-danger">Gagal</button>
                `:''}
              </td>
            </tr>`).join('')}
          </table>
        </div>
      </div>`;
    }

    async function verifMasuk(id, aksi) {
      if (!confirm(`${aksi==='setuju'?'Setujui':'Tolak'} saldo masuk ini?`)) return;
      await api('verifikasiMasuk', {id_tr:id, aksi});
      muatTransaksi();
    }

    async function verifTarik(id, aksi) {
      const pesan = aksi==='berhasil' ? 'Tandai penarikan BERHASIL?' :
                    aksi==='gagal' ? 'Tandai sebagai GAGAL — saldo akan dikembalikan ke akun?' :
                    'Masukkan ke tahap MEMPROSES?';
      if (!confirm(pesan)) return;
      await api('verifikasiTarik', {id_tr:id, aksi});
      muatTransaksi();
    }

    // Render Utama Admin
    function render() {
      const el = document.getElementById('app');
      if (!cekSesi()) {
        el.innerHTML = renderLogin();
      } else {
        let konten = '';
        switch(state.tab) {
          case 'afiliator': konten = renderAfiliator(); break;
          case 'transaksi': konten = renderTransaksi(); break;
          default: konten = renderPengajuan();
        }
        el.innerHTML = tabs() + konten;
      }
    }

    // Refresh otomatis tiap 30 detik
    setInterval(() => {
      if (cekSesi()) {
        if (state.tab === 'pengajuan') muatPengajuan();
        if (state.tab === 'afiliator') muatAfiliator();
        if (state.tab === 'transaksi') muatTransaksi();
      }
    }, 30000);

    render();
  </script>
</body>
</html>
