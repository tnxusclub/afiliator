<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - Sistem Afiliasi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary:'#165DFF', dark:'#1F2937', light:'#F9FAFB', admin:'#0F172A' },
        }
      }
    }
  </script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
  <div id="app">
    <!-- Login Admin -->
    <div id="hal-login" class="flex items-center justify-center min-h-screen bg-admin">
      <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8">
        <h2 class="text-2xl font-bold text-center mb-6">🔐 Masuk Admin</h2>
        <input type="text" id="auser" placeholder="Username Admin" class="w-full p-3 border rounded-xl mb-3">
        <input type="password" id="apass" placeholder="Kata Sandi" class="w-full p-3 border rounded-xl mb-4">
        <button onclick="loginAdmin()" class="w-full bg-primary text-white p-3 rounded-xl font-medium hover:bg-primary/90">Masuk Panel</button>
      </div>
    </div>

    <!-- Panel Utama -->
    <div id="hal-admin" class="hidden">
      <header class="bg-admin text-white p-4 flex justify-between items-center shadow">
        <h1 class="font-bold text-lg">PANEL ADMIN — Sistem Afiliasi</h1>
        <button onclick="keluar()" class="bg-red-500/20 text-red-300 px-3 py-1 rounded-lg hover:bg-red-500/30">Keluar</button>
      </header>

      <div class="p-4 space-y-6">
        <!-- Menu Tab -->
        <div class="flex flex-wrap gap-2">
          <button onclick="tab('pengguna')" class="t-btn bg-primary text-white px-4 py-2 rounded-lg">Pengguna</button>
          <button onclick="tab('penarikan')" class="t-btn bg-gray-200 px-4 py-2 rounded-lg">Penarikan</button>
          <button onclick="tab('transaksi')" class="t-btn bg-gray-200 px-4 py-2 rounded-lg">Transaksi</button>
          <button onclick="tab('tambah')" class="t-btn bg-gray-200 px-4 py-2 rounded-lg">+ Tambah Transaksi</button>
        </div>

        <!-- Daftar Pengguna -->
        <div id="tab-pengguna" class="bg-white rounded-2xl shadow p-5">
          <h3 class="font-bold text-lg mb-4">Daftar Afiliator</h3>
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-gray-50">
                <tr>
                  <th class="p-2 text-left">ID</th>
                  <th class="p-2 text-left">Nama</th>
                  <th class="p-2 text-left">No HP</th>
                  <th class="p-2 text-left">Status</th>
                  <th class="p-2 text-left">Aksi</th>
                </tr>
              </thead>
              <tbody id="isi-pengguna"></tbody>
            </table>
          </div>
        </div>

        <!-- Daftar Penarikan -->
        <div id="tab-penarikan" class="hidden bg-white rounded-2xl shadow p-5">
          <h3 class="font-bold text-lg mb-4">Permintaan Penarikan</h3>
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-gray-50">
                <tr>
                  <th class="p-2 text-left">ID</th>
                  <th class="p-2 text-left">Afiliator</th>
                  <th class="p-2 text-left">Nominal</th>
                  <th class="p-2 text-left">Metode</th>
                  <th class="p-2 text-left">Status</th>
                  <th class="p-2 text-left">Aksi</th>
                </tr>
              </thead>
              <tbody id="isi-penarikan"></tbody>
            </table>
          </div>
        </div>

        <!-- Daftar Transaksi -->
        <div id="tab-transaksi" class="hidden bg-white rounded-2xl shadow p-5">
          <h3 class="font-bold text-lg mb-4">Riwayat Transaksi</h3>
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-gray-50">
                <tr>
                  <th class="p-2 text-left">ID Trans</th>
                  <th class="p-2 text-left">Afiliator</th>
                  <th class="p-2 text-left">Jumlah</th>
                  <th class="p-2 text-left">Keterangan</th>
                  <th class="p-2 text-left">Tanggal</th>
                </tr>
              </thead>
              <tbody id="isi-transaksi"></tbody>
            </table>
          </div>
        </div>

        <!-- Tambah Transaksi -->
        <div id="tab-tambah" class="hidden bg-white rounded-2xl shadow p-5">
          <h3 class="font-bold text-lg mb-4">Catat Transaksi / Komisi</h3>
          <div class="space-y-3 max-w-md">
            <input type="text" id="t-idafiliator" placeholder="ID Afiliator" class="w-full p-3 border rounded-xl">
            <input type="number" id="t-jumlah" placeholder="Nominal Komisi (Rp)" class="w-full p-3 border rounded-xl">
            <input type="text" id="t-keterangan" placeholder="Keterangan / Pesanan" class="w-full p-3 border rounded-xl">
            <button onclick="simpanTransaksi()" class="w-full bg-primary text-white p-3 rounded-xl hover:bg-primary/90">Simpan Transaksi</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // === KONFIGURASI ===
    const DEPLOY_URL = "https://script.google.com/macros/s/AKfycbzXam10TMXOO04YfwsHQHErvuQ0Wtvwx1wE9qeg9KViP_y_Vpv7n-cAcUOVEh-eI0uEGg/exec"; // Sama dengan di atas
    const ADMIN_USER = "admin_tnxus"; // Ganti username admin
    const ADMIN_PASS = "katasandi_admin123"; // Ganti sandi admin

    let dataPengguna = [], dataPenarikan = [], dataTransaksi = [];

    function loginAdmin() {
      const u = document.getElementById("auser").value;
      const p = document.getElementById("apass").value;
      if(u===ADMIN_USER && p===ADMIN_PASS) {
        document.getElementById("hal-login").classList.add("hidden");
        document.getElementById("hal-admin").classList.remove("hidden");
        muatSemua();
      } else alert("Akses ditolak!");
    }

    async function muatSemua() {
      // Pengguna
      let res = await fetch(DEPLOY_URL, {method:"POST", body:new URLSearchParams({action:"daftarPengguna"})}).then(r=>r.json());
      dataPengguna = res.data;
      let html = "";
      dataPengguna.forEach(p=>{
        html += `<tr class="border-t">
          <td class="p-2 font-mono text-xs">${p[0]}</td>
          <td class="p-2">${p[1]}</td>
          <td class="p-2">${p[2]}</td>
          <td class="p-2"><span class="px-2 py-1 rounded-full text-xs ${p[4]==='aktif'?'bg-green-100 text-green-700':'bg-yellow-100 text-yellow-700'}">${p[4]}</span></td>
          <td class="p-2">
            ${p[4]!=='aktif'?`<button onclick="ubahStatus('${p[0]}','aktif')" class="text-green-600 text-xs">Aktifkan</button>`:''}
            <button onclick="ubahStatus('${p[0]}','blokir')" class="text-red-600 text-xs ml-2">Blokir</button>
          </td>
        </tr>`;
      });
      document.getElementById("isi-pengguna").innerHTML = html;

      // Penarikan
      res = await fetch(DEPLOY_URL, {method:"POST", body:new URLSearchParams({action:"daftarPenarikan"})}).then(r=>r.json());
      dataPenarikan = res.data;
      html = "";
      dataPenarikan.forEach(p=>{
        html += `<tr class="border-t">
          <td class="p-2 font-mono text-xs">${p[0]}</td>
          <td class="p-2">${p[1]}</td>
          <td class="p-2">Rp ${p[2]}</td>
          <td class="p-2">${p[3]} — ${p[4]}</td>
          <td class="p-2"><span class="px-2 py-1 rounded-full text-xs ${p[5]==='menunggu'?'bg-yellow-100 text-yellow-700':'bg-green-100 text-green-700'}">${p[5]}</span></td>
          <td class="p-2">
            ${p[5]==='menunggu'?`<button onclick="prosesTarik('${p[0]}','selesai')" class="text-green-600 text-xs">Selesai</button>
            <button onclick="prosesTarik('${p[0]}','ditolak')" class="text-red-600 text-xs ml-1">Tolak</button>`:'Selesai'}
          </td>
        </tr>`;
      });
      document.getElementById("isi-penarikan").innerHTML = html;

      // Transaksi
      res = await fetch(DEPLOY_URL, {method:"POST", body:new URLSearchParams({action:"daftarTransaksi"})}).then(r=>r.json());
      dataTransaksi = res.data;
      html = "";
      dataTransaksi.forEach(p=>{
        html += `<tr class="border-t">
          <td class="p-2 font-mono text-xs">${p[0]}</td>
          <td class="p-2">${p[1]}</td>
          <td class="p-2">Rp ${p[2]}</td>
          <td class="p-2">${p[4]||'-'}</td>
          <td class="p-2 text-xs text-gray-500">${new Date(p[3]).toLocaleDateString('id-ID')}</td>
        </tr>`;
      });
      document.getElementById("isi-transaksi").innerHTML = html;
    }

    function tab(nama) {
      ["pengguna","penarikan","transaksi","tambah"].forEach(t=>{
        document.getElementById(`tab-${t}`).classList.toggle("hidden", t!==nama);
      });
      document.querySelectorAll(".t-btn").forEach(b=>{
        b.classList.remove("bg-primary","text-white");
        b.classList.add("bg-gray-200");
      });
      event.target.classList.add("bg-primary","text-white");
      event.target.classList.remove("bg-gray-200");
    }

    async function ubahStatus(id, status) {
      alert(`Status akun ${id} diubah menjadi ${status}`);
      muatSemua();
    }

    async function prosesTarik(idTarik, status) {
      await fetch(DEPLOY_URL, {
        method:"POST",
        body:new URLSearchParams({action:"updateStatusTarik", idTarik, status})
      });
      muatSemua();
    }

    async function simpanTransaksi() {
      const idAfiliator = document.getElementById("t-idafiliator").value.trim();
      const jumlah = document.getElementById("t-jumlah").value;
      const ket = document.getElementById("t-keterangan").value.trim();
      if(!idAfiliator || !jumlah) return alert("Lengkapi data!");

      const idTrans = "TRS" + Math.random().toString(36).substr(2,6).toUpperCase();
      const ss = SpreadsheetApp.getActiveSpreadsheet();
      const sheet = ss.getSheetByName("Transaksi");
      sheet.appendRow([idTrans, idAfiliator, jumlah, new Date(), ket]);
      
      alert("Transaksi tersimpan!");
      muatSemua();
    }

    function keluar() {
      document.getElementById("hal-admin").classList.add("hidden");
      document.getElementById("hal-login").classList.remove("hidden");
    }
  </script>
</body>
</html>
