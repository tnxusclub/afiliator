<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - Afiliasi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#165DFF',
            success: '#10B981',
            warning: '#F59E0B',
            danger: '#EF4444',
            dark: '#1E293B',
          }
        }
      }
    }
  </script>
  <style>
    .page { display: none; }
    .page.active { display: block; }
    .tab-active { border-b-2px solid #165DFF; color: #165DFF; font-weight: 600; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-lg font-bold text-primary">Panel Admin</h1>
      <button id="btnLogout" class="text-sm text-gray-500 hover:text-danger hidden" onclick="logout()">
        <i class="fa fa-sign-out"></i> Keluar
      </button>
    </div>
  </header>

  <main class="container mx-auto px-4 py-4">
    <!-- Halaman Login -->
    <div id="page-login" class="max-w-md mx-auto mt-20">
      <div class="bg-white rounded-xl shadow-sm p-6">
        <h2 class="text-xl font-bold text-center mb-6">Masuk Admin</h2>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1">Username</label>
            <input type="text" id="admin_user" class="w-full px-4 py-2.5 rounded-lg border border-gray-200">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Kata Sandi</label>
            <input type="password" id="admin_pass" class="w-full px-4 py-2.5 rounded-lg border border-gray-200">
          </div>
          <button onclick="loginAdmin()" class="w-full bg-primary text-white py-2.5 rounded-lg font-medium">Masuk</button>
        </div>
      </div>
    </div>

    <!-- Halaman Utama -->
    <div id="page-dashboard" class="hidden">
      <!-- Tab Nav -->
      <div class="flex border-b border-gray-200 mb-6 overflow-x-auto">
        <button class="px-4 py-3 tab-btn tab-active" data-tab="afiliator">Data Afiliator</button>
        <button class="px-4 py-3 tab-btn text-gray-500" data-tab="transaksi">Transaksi</button>
        <button class="px-4 py-3 tab-btn text-gray-500" data-tab="saldo">Verifikasi Saldo</button>
        <button class="px-4 py-3 tab-btn text-gray-500" data-tab="penarikan">Penarikan</button>
      </div>

      <!-- Tab: Afiliator -->
      <div id="tab-afiliator" class="tab-content active">
        <div class="bg-white rounded-xl shadow-sm p-4 mb-6">
          <h3 class="font-semibold mb-4">Tambah Afiliator Baru</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div><input type="text" id="new_nama" placeholder="Nama Lengkap" class="w-full px-3 py-2 border rounded-lg"></div>
            <div><input type="text" id="new_hp" placeholder="Nomor HP" class="w-full px-3 py-2 border rounded-lg"></div>
            <div><input type="text" id="new_user" placeholder="Username" class="w-full px-3 py-2 border rounded-lg"></div>
            <div><input type="password" id="new_pass" placeholder="Kata Sandi" class="w-full px-3 py-2 border rounded-lg"></div>
          </div>
          <button onclick="tambahAfiliator()" class="mt-3 bg-primary text-white px-4 py-2 rounded-lg">Simpan</button>
        </div>

        <div class="bg-white rounded-xl shadow-sm p-4">
          <h3 class="font-semibold mb-4">Daftar Afiliator</h3>
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-gray-50">
                <tr>
                  <th class="p-2 text-left">ID</th>
                  <th class="p-2 text-left">Nama</th>
                  <th class="p-2 text-left">HP</th>
                  <th class="p-2 text-left">Saldo</th>
                  <th class="p-2 text-left">Status</th>
                  <th class="p-2 text-left">Aksi</th>
                </tr>
              </thead>
              <tbody id="daftarAfiliator"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Tab: Transaksi -->
      <div id="tab-transaksi" class="tab-content hidden">
        <div class="bg-white rounded-xl shadow-sm p-4 mb-6">
          <h3 class="font-semibold mb-4">Tambah Transaksi</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div><input type="text" id="trans_id_afiliasi" placeholder="ID Afiliasi" class="w-full px-3 py-2 border rounded-lg"></div>
            <div><input type="number" id="trans_jumlah" placeholder="Jumlah" class="w-full px-3 py-2 border rounded-lg"></div>
            <div><select id="trans_jenis" class="w-full px-3 py-2 border rounded-lg">
              <option value="masuk">Saldo Masuk</option>
              <option value="keluar">Pengurangan</option>
            </select></div>
            <div><input type="text" id="trans_keterangan" placeholder="Keterangan" class="w-full px-3 py-2 border rounded-lg"></div>
          </div>
          <button onclick="tambahTransaksi()" class="mt-3 bg-primary text-white px-4 py-2 rounded-lg">Simpan Transaksi</button>
        </div>

        <div class="bg-white rounded-xl shadow-sm p-4">
          <h3 class="font-semibold mb-4">Riwayat Semua Transaksi</h3>
          <div id="riwayatTransaksi" class="space-y-2 text-sm"></div>
        </div>
      </div>

      <!-- Tab: Verifikasi Saldo Masuk -->
      <div id="tab-saldo" class="tab-content hidden">
        <div class="bg-white rounded-xl shadow-sm p-4">
          <h3 class="font-semibold mb-4">Verifikasi Saldo Masuk</h3>
          <div id="verifikasiSaldoMasuk" class="space-y-4"></div>
        </div>
      </div>

      <!-- Tab: Verifikasi Penarikan -->
      <div id="tab-penarikan" class="tab-content hidden">
        <div class="bg-white rounded-xl shadow-sm p-4">
          <h3 class="font-semibold mb-4">Pengajuan Penarikan</h3>
          <div id="daftarPenarikan" class="space-y-4"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const APPSCRIPT_URL = "https://script.google.com/macros/s/AKfycbw-oXQe7tpfNqdgd_TbNHWTvi57uDlecOUkXllNMs9ejA-gYKVUFls_Uc9KLKL39idJ6A/exec"; // Ganti SAMA URL di atas
    let adminSesi = null;

    document.addEventListener('DOMContentLoaded', () => {
      cekSesiAdmin();
      
      // Tab switching
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => {
            b.classList.remove('tab-active'); b.classList.add('text-gray-500');
          });
          btn.classList.add('tab-active'); btn.classList.remove('text-gray-500');
          
          document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
          document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
          
          if(adminSesi) muatDataAdmin();
        });
      });
    });

    function cekSesiAdmin() {
      const sesi = JSON.parse(localStorage.getItem('admin_sesi') || '{}');
      if(sesi.nama && (Date.now() - sesi.terakhir_login) < 30*24*60*60*1000) {
        adminSesi = sesi;
        masukDashboard();
      }
    }

    async function loginAdmin() {
      const username = document.getElementById('admin_user').value.trim();
      const password = document.getElementById('admin_pass').value;
      
      const res = await fetch(APPSCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({aksi: 'login_admin', username, password})
      });
      
      const data = await res.json();
      if(data.sukses) {
        adminSesi = { nama: username, terakhir_login: Date.now() };
        localStorage.setItem('admin_sesi', JSON.stringify(adminSesi));
        masukDashboard();
      } else {
        alert('Login gagal');
      }
    }

    function masukDashboard() {
      document.getElementById('page-login').classList.add('hidden');
      document.getElementById('page-dashboard').classList.remove('hidden');
      document.getElementById('btnLogout').classList.remove('hidden');
      muatDataAdmin();
      setInterval(muatDataAdmin, 30000);
    }

    async function muatDataAdmin() {
      const res = await fetch(APPSCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({aksi: 'data_admin'})
      });
      
      const data = await res.json();
      if(!data.sukses) return;
      
      // Daftar Afiliator
      document.getElementById('daftarAfiliator').innerHTML = data.afiliator.map(u => `
        <tr class="border-t">
          <td class="p-2">${u.id}</td>
          <td class="p-2">${u.nama}</td>
          <td class="p-2">${u.no_hp}</td>
          <td class="p-2">Rp${(u.saldo_tersedia || 0).toLocaleString()}</td>
          <td class="p-2">
            <span class="px-2 py-0.5 rounded text-xs ${u.status === 'aktif' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
              ${u.status}
            </span>
          </td>
          <td class="p-2">
            <button onclick="ubahStatus('${u.id}', '${u.status === 'aktif' ? 'nonaktif' : 'aktif'}')" 
              class="text-sm px-2 py-1 ${u.status === 'aktif' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'} rounded">
              ${u.status === 'aktif' ? 'Nonaktifkan' : 'Aktifkan'}
            </button>
          </td>
        </tr>
      `).join('');
      
      // Verifikasi Saldo Masuk
      document.getElementById('verifikasiSaldoMasuk').innerHTML = data.pending_saldo_masuk.length ? 
        data.pending_saldo_masuk.map(t => `
          <div class="border p-3 rounded-lg">
            <p class="font-medium">${t.keterangan}</p>
            <p>Afiliasi: ${t.id_afiliasi} | Rp${t.jumlah.toLocaleString()}</p>
            <p class="text-sm text-yellow-600 mb-2">Status: Menunggu verifikasi</p>
            <div class="flex gap-2">
              <button onclick="setujuiSaldoMasuk('${t.id}')" class="bg-success text-white px-3 py-1 rounded">Setujui</button>
              <button onclick="tolakSaldoMasuk('${t.id}')" class="bg-gray-200 px-3 py-1 rounded">Tolak</button>
            </div>
          </div>
        `).join('') : '<p class="text-gray-400">Tidak ada yang menunggu verifikasi</p>';
      
      // Penarikan
      document.getElementById('daftarPenarikan').innerHTML = data.penarikan.length ? 
        data.penarikan.map(p => `
          <div class="border p-3 rounded-lg">
            <p class="font-medium">Afiliasi: ${p.id_afiliasi}</p>
            <p>Nominal: Rp${p.nominal.toLocaleString()}</p>
            <p>Tujuan: ${p.metode} - ${p.nama} ${p.nomor}</p>
            <p class="text-sm text-yellow-600 mb-2">Status: ${p.status}</p>
            ${p.status === 'menunggu' ? `
              <div class="flex gap-2">
                <button onclick="prosesPenarikan('${p.id}', 'proses')" class="bg-warning text-white px-3 py-1 rounded">Sedang Diproses</button>
                <button onclick="prosesPenarikan('${p.id}', 'berhasil')" class="bg-success text-white px-3 py-1 rounded">Berhasil</button>
                <button onclick="prosesPenarikan('${p.id}', 'gagal')" class="bg-danger text-white px-3 py-1 rounded">Gagal</button>
              </div>
            ` : ''}
            ${p.status === 'diproses' ? `
              <button onclick="prosesPenarikan('${p.id}', 'berhasil')" class="bg-success text-white px-3 py-1 rounded">Tandai Berhasil</button>
            ` : ''}
          </div>
        `).join('') : '<p class="text-gray-400">Tidak ada pengajuan</p>';
    }

    async function tambahAfiliator() {
      const data = {
        aksi: 'tambah_afiliator',
        nama: document.getElementById('new_nama').value.trim(),
        no_hp: document.getElementById('new_hp').value.trim(),
        username: document.getElementById('new_user').value.trim(),
        password: document.getElementById('new_pass').value
      };
      
      const res = await fetch(APPSCRIPT_URL, {method: 'POST', body: JSON.stringify(data)});
      const hasil = await res.json();
      if(hasil.sukses) { alert('Berhasil ditambahkan'); muatDataAdmin(); }
      else alert(hasil.pesan);
    }

    async function ubahStatus(id, status) {
      await fetch(APPSCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({aksi: 'ubah_status', id, status})
      });
      muatDataAdmin();
    }

    async function tambahTransaksi() {
      const data = {
        aksi: 'tambah_transaksi',
        id_afiliasi: document.getElementById('trans_id_afiliasi').value.trim(),
        jumlah: parseInt(document.getElementById('trans_jumlah').value),
        jenis: document.getElementById('trans_jenis').value,
        keterangan: document.getElementById('trans_keterangan').value.trim()
      };
      
      const res = await fetch(APPSCRIPT_URL, {method: 'POST', body: JSON.stringify(data)});
      const hasil = await res.json();
      if(hasil.sukses) alert('Transaksi dicatat & masuk ke saldo pending');
      else alert(hasil.pesan);
    }

    async function setujuiSaldoMasuk(id) {
      await fetch(APPSCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({aksi: 'verifikasi_saldo_masuk', id, disetujui: true})
      });
      muatDataAdmin();
    }

    async function tolakSaldoMasuk(id) {
      await fetch(APPSCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({aksi: 'verifikasi_saldo_masuk', id, disetujui: false})
      });
      muatDataAdmin();
    }

    async function prosesPenarikan(id, status) {
      await fetch(APPSCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({aksi: 'proses_penarikan', id, status})
      });
      muatDataAdmin();
    }

    function logout() {
      localStorage.removeItem('admin_sesi');
      location.reload();
    }
  </script>
</body>
</html>
