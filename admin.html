<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — TNXUS CLUB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {theme:{extend:{colors:{prim:'#0f172a',sek:'#1e293b',aksen:'#f97316',hijau:'#10b981',merah:'#ef4444',abu:'#64748b'}}}}
  </script>
  <style>
    body{background:#0f172a;color:white;min-height:100vh;}
    .kartu{background:#1e293b;border-radius:0.75rem;padding:1rem;margin-bottom:1rem;}
    input,select{background:#334155;border:none;border-radius:0.5rem;padding:0.6rem;color:white;width:100%;margin:0.4rem 0;}
    .tombol{border:none;border-radius:0.5rem;padding:0.6rem 1rem;font-weight:600;cursor:pointer;}
    .tombol-utama{background:#f97316;color:white;}
    .tombol-hijau{background:#10b981;color:white;}
    .tombol-merah{background:#ef4444;color:white;}
    .tombol-biru{background:#3b82f6;color:white;}
    .halaman{display:none;}
    .halaman.aktif{display:block;}
    .aktif{background:#f9731622;border-left:3px solid #f97316;}
    tr:hover{background:#334155;}
    td,th{padding:0.5rem;border-bottom:1px solid #475569;}
    th{text-align:left;color:#94a3b8;}
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:220px;background:#1e293b;padding:1rem;overflow-y:auto;}
    .konten{margin-left:240px;padding:1rem;}
    @media(max-width:768px){.sidebar{position:sticky;width:100%;height:auto;}.konten{margin-left:0;}.sidebar nav{display:flex;overflow-x:auto;gap:0.5rem;}}
  </style>
</head>
<body>
  <div id="layar_login" class="flex items-center justify-center min-h-screen">
    <div class="kartu w-full max-w-sm">
      <h2 class="text-xl font-bold mb-6 text-center">PANEL ADMIN</h2>
      <input type="text" id="adm_user" placeholder="Username Admin">
      <input type="password" id="adm_pass" placeholder="Password">
      <button class="tombol tombol-utama w-full mt-2" onclick="loginAdmin()">Masuk</button>
      <p id="pesan_login" class="text-red-400 mt-2 text-center"></p>
    </div>
  </div>

  <div id="admin" class="sembunyi">
    <aside class="sidebar">
      <h2 class="font-bold text-lg mb-4">Admin Panel</h2>
      <nav class="space-y-1">
        <button class="aktif w-full text-left p-2 rounded" data-hlm="daftar_user"><i class="fa fa-users"></i> Daftar Afiliator</button>
        <button class="w-full text-left p-2 rounded" data-hlm="tambah_saldo"><i class="fa fa-plus-circle"></i> Tambah Saldo Masuk</button>
        <button class="w-full text-left p-2 rounded" data-hlm="verif_saldo"><i class="fa fa-check-square-o"></i> Verifikasi Saldo</button>
        <button class="w-full text-left p-2 rounded" data-hlm="tarik_saldo"><i class="fa fa-money"></i> Penarikan Saldo</button>
        <button class="w-full text-left p-2 rounded text-red-400" onclick="keluar()"><i class="fa fa-sign-out"></i> Keluar</button>
      </nav>
    </aside>

    <main class="konten">
      <!-- Daftar Afiliator -->
      <div id="hlm_daftar_user" class="halaman aktif">
        <h3 class="text-lg font-bold mb-4">Daftar Pengguna & Pendaftaran Baru</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead><tr><th>ID</th><th>Nama</th><th>Username</th><th>Status Daftar</th><th>Aksi</th></tr></thead>
            <tbody id="tabel_user"></tbody>
          </table>
        </div>
      </div>

      <!-- Tambah Saldo -->
      <div id="hlm_tambah_saldo" class="halaman">
        <h3 class="text-lg font-bold mb-4">Tambah Saldo Masuk</h3>
        <div class="kartu max-w-md">
          <input type="text" id="ts_iduser" placeholder="ID Afiliasi">
          <input type="number" id="ts_jumlah" placeholder="Jumlah Rp">
          <input type="text" id="ts_keterangan" placeholder="Keterangan / Sumber">
          <button class="tombol tombol-hijau w-full" onclick="tambahSaldo()">Tambah Saldo</button>
          <p id="pesan_ts" class="mt-2 text-sm"></p>
        </div>
      </div>

      <!-- Verifikasi Saldo -->
      <div id="hlm_verif_saldo" class="halaman">
        <h3 class="text-lg font-bold mb-4">Verifikasi Saldo Masuk</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead><tr><th>ID Transaksi</th><th>ID User</th><th>Jumlah</th><th>Keterangan</th><th>Status</th><th>Aksi</th></tr></thead>
            <tbody id="tabel_saldo_masuk"></tbody>
          </table>
        </div>
      </div>

      <!-- Penarikan Saldo -->
      <div id="hlm_tarik_saldo" class="halaman">
        <h3 class="text-lg font-bold mb-4">Pengajuan Penarikan Saldo</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead><tr><th>ID Ajuan</th><th>ID User</th><th>Nominal</th><th>Metode</th><th>Tujuan</th><th>Status</th><th>Aksi</th></tr></thead>
            <tbody id="tabel_tarik_saldo"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

<script>
const URL_API = 'https://script.google.com/macros/s/AKfycbxAFKnMYTgGmZLiRtKCl8ol1gjq0KIwdbZ7VAuJIr0E6aTY8b7QxjSEsMxbgvsz4qWbCw/exec'; // Ganti sama URL Web App seperti di aplikasi afiliasi
let token = localStorage.getItem('admin_token');

window.onload = function() {
  if (token) muatHalamanAdmin();
  
  // Navigasi sidebar
  document.querySelectorAll('.sidebar button[data-hlm]').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.sidebar button').forEach(b => b.classList.remove('aktif'));
      btn.classList.add('aktif');
      document.querySelectorAll('.halaman').forEach(h => h.classList.remove('aktif'));
      document.getElementById('hlm_' + btn.dataset.hlm).classList.add('aktif');
      
      // Muat data saat dibuka
      if (btn.dataset.hlm === 'daftar_user') muatDaftarUser();
      if (btn.dataset.hlm === 'verif_saldo') muatVerifSaldo();
      if (btn.dataset.hlm === 'tarik_saldo') muatTarikSaldo();
    };
  });
};

async function loginAdmin() {
  const username = document.getElementById('adm_user').value;
  const password = document.getElementById('adm_pass').value;
  
  const res = await fetch(URL_API, {
    method: 'POST',
    body: new URLSearchParams({ aksi: 'login_admin', username, password })
  });
  const data = await res.json();
  
  if (data.sukses) {
    token = data.token;
    localStorage.setItem('admin_token', token);
    muatHalamanAdmin();
  } else {
    document.getElementById('pesan_login').textContent = data.pesan;
  }
}

function muatHalamanAdmin() {
  document.getElementById('layar_login').classList.add('sembunyi');
  document.getElementById('admin').classList.remove('sembunyi');
  muatDaftarUser();
}

async function muatDaftarUser() {
  const res = await fetch(URL_API, {
    method: 'POST',
    body: new URLSearchParams({ aksi: 'daftar_user', token })
  });
  const data = await res.json();
  if (!data.sukses) return keluar();
  
  const tbody = document.getElementById('tabel_user');
  tbody.innerHTML = data.map(u => `
    <tr>
      <td>${u.id}</td>
      <td>${u.nama}</td>
      <td>${u.username}</td>
      <td>
        <span class="px-2 py-1 rounded text-xs ${
          u.status_pendaftaran === 'DITERIMA' ? 'bg-green-600/30 text-green-300' :
          u.status_pendaftaran === 'DITOLAK' ? 'bg-red-600/30 text-red-300' :
          'bg-yellow-600/30 text-yellow-300'
        }">${u.status_pendaftaran}</span>
      </td>
      <td>
        ${u.status_pendaftaran === 'MENUNGGU' ? `
          <button class="tombol tombol-hijau text-xs py-1 px-2" onclick="prosesDaftar('${u.id}','setujui')">Setujui</button>
          <button class="tombol tombol-merah text-xs py-1 px-2" onclick="prosesDaftar('${u.id}','tolak')">Tolak</button>
        ` : ''}
        <button class="tombol ${u.status_akun === 'AKTIF' ? 'tombol-merah' : 'tombol-hijau'} text-xs py-1 px-2" 
          onclick="toggleAkun('${u.id}','${u.status_akun === 'AKTIF' ? 'NONAKTIF' : 'AKTIF'}')">
          ${u.status_akun === 'AKTIF' ? 'Nonaktifkan' : 'Aktifkan'}
        </button>
      </td>
    </tr>
  `).join('');
}

async function prosesDaftar(idUser, status) {
  await fetch(URL_API, {
    method: 'POST',
    body: new URLSearchParams({ aksi: 'verif_daftar', token, id_user: idUser, status })
  });
  muatDaftarUser();
}

async function toggleAkun(idUser, status) {
  await fetch(URL_API, {
    method: 'POST',
    body: new URLSearchParams({ aksi: 'toggle_akun', token, id_user: idUser, status })
  });
  muatDaftarUser();
}

async function tambahSaldo() {
  const idUser = document.getElementById('ts_iduser').value;
  const jumlah = Number(document.getElementById('ts_jumlah').value);
  const keterangan = document.getElementById('ts_keterangan').value;
  
  const res = await fetch(URL_API, {
    method: 'POST',
    body: new URLSearchParams({ aksi: 'tambah_saldo', token, id_user: idUser, jumlah, keterangan })
  });
  const data = await res.json();
  
  const pesan = document.getElementById('pesan_ts');
  pesan.textContent = data.sukses ? '✅ Saldo berhasil ditambahkan ke antrean verifikasi' : '❌ Gagal: ' + (data.pesan || 'Kesalahan sistem');
  pesan.className = data.sukses ? 'mt-2 text-sm text-green-400' : 'mt-2 text-sm text-red-400';
  
  if (data.sukses) {
    document.getElementById('ts_iduser').value = '';
    document.getElementById('ts_jumlah').value = '';
    document.getElementById('ts_keterangan').value = '';
  }
}

async function muatVerifSaldo() {
  const res = await fetch(URL_API, {
    method: 'POST',
    body: new URLSearchParams({ aksi: 'riwayat_masuk', token })
  });
  const data = await res.json();
  
  const tbody = document.getElementById('tabel_saldo_masuk');
  tbody.innerHTML = data.length === 0 ? '<tr><td colspan="6" class="text-center text-gray-400 py-4">Tidak ada data</td></tr>' :
    data.map(t => `
      <tr>
        <td>${t.id}</td>
        <td>${t.id_user}</td>
        <td>Rp ${Number(t.jumlah).toLocaleString('id-ID')}</td>
        <td>${t.keterangan || '-'}</td>
        <td>
          <span class="px-2 py-1 rounded text-xs ${
            t.status === 'SELESAI' ? 'bg-green-600/30 text-green-300' :
            t.status === 'DITOLAK' ? 'bg-red-600/30 text-red-300' :
            'bg-yellow-600/30 text-yellow-300'
          }">${t.status}</span>
        </td>
        <td>
          ${t.status === 'PENDING' ? `
            <button class="tombol tombol-hijau text-xs py-1 px-2" onclick="setujuiSaldo('${t.id}')">Setujui</button>
            <button class="tombol tombol-merah text-xs py-1 px-2" onclick="tolakSaldo('${t.id}')">Tolak</button>
          ` : ''}
          ${t.status === 'DITERIMA' ? `
            <button class="tombol tombol-biru text-xs py-1 px-2" onclick="pindahTersedia('${t.id}')">→ Tersedia</button>
          ` : ''}
        </td>
      </tr>
    `).join('');
}

async function setujuiSaldo(idTrx) {
  await fetch(URL_API, {
    method: 'POST',
    body: new URLSearchParams({ aksi: 'verif_saldo', token, id_trx: idTrx, status: 'setujui' })
  });
  muatVerifSaldo();
}

async function tolakSaldo(idTrx) {
  await fetch(URL_API, {
    method: 'POST',
    body: new URLSearchParams({ aksi: 'verif_saldo', token, id_trx: idTrx, status: 'tolak' })
  });
  muatVerifSaldo();
}

async function pindahTersedia(idTrx) {
  await fetch(URL_API, {
    method: 'POST',
    body: new URLSearchParams({ aksi: 'ke_tersedia', token, id_trx: idTrx })
  });
  muatVerifSaldo();
}

async function muatTarikSaldo() {
  const res = await fetch(URL_API, {
    method: 'POST',
    body: new URLSearchParams({ aksi: 'daftar_wd', token })
  });
  const data = await res.json();
  
  const tbody = document.getElementById('tabel_tarik_saldo');
  tbody.innerHTML = data.length === 0 ? '<tr><td colspan="7" class="text-center text-gray-400 py-4">Tidak ada pengajuan</td></tr>' :
    data.map(w => `
      <tr>
        <td>${w.id}</td>
        <td>${w.id_user}</td>
        <td>Rp ${Number(w.nominal).toLocaleString('id-ID')}</td>
        <td>${w.metode}</td>
        <td>${w.nomor} — ${w.nama_pemilik}</td>
        <td>
          <span class="px-2 py-1 rounded text-xs ${
            w.status === 'BERHASIL' ? 'bg-green-600/30 text-green-300' :
            w.status === 'DITOLAK' ? 'bg-red-600/30 text-red-300' :
            'bg-yellow-600/30 text-yellow-300'
          }">${w.status}</span>
        </td>
        <td>
          ${w.status === 'MENUNGGU' ? `
            <button class="tombol tombol-hijau text-xs py-1 px-2" onclick="prosesWD('${w.id}','BERHASIL')">Berhasil</button>
            <button class="tombol tombol-merah text-xs py-1 px-2" onclick="prosesWD('${w.id}','DITOLAK')">Gagal</button>
          ` : ''}
        </td>
      </tr>
    `).join('');
}

async function prosesWD(idWd, status) {
  const catatan = prompt('Masukkan catatan (opsional):');
  await fetch(URL_API, {
    method: 'POST',
    body: new URLSearchParams({ aksi: 'proses_wd', token, id_wd: idWd, status, catatan: catatan || '' })
  });
  muatTarikSaldo();
}

async function keluar() {
  await fetch(URL_API, { method: 'POST', body: new URLSearchParams({ aksi: 'keluar', token }) });
  localStorage.removeItem('admin_token');
  token = null;
  location.reload();
}
</script>
</body>
</html>
