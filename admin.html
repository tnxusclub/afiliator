<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - TNXUS CLUB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
  <script>tailwind.config={theme:{extend:{colors:{utama:'#0f0f23', panel:'#1a1a3e', aksen:'#00ffa3', hijau:'#10b981', merah:'#ef4444', abu:'#9ca3af'}}}};</script>
  <style>
    body{background:linear-gradient(135deg,#0f0f23,#1a1a3e); min-height:100vh;}
    .kartu{background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:12px;}
    input,select{background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius:8px; padding:8px 12px; color:white; width:100%;}
    .tombol{transition:all .2s;}
    .tombol:hover{transform:translateY(-1px);}
    .hal{display:none;}
    .hal.aktif{display:block; animation:masuk .3s ease;}
    @keyframes masuk{from{opacity:0;transform:translateY(10px);} to{opacity:1;}}
    .aktif-tab{background:rgba(0,255,163,0.15); color:#00ffa3;}
  </style>
</head>
<body class="text-white">
  <!-- Login -->
  <div id="halLogin" class="flex items-center justify-center min-h-screen p-4">
    <div class="kartu p-8 w-full max-w-md">
      <h1 class="text-2xl font-bold text-center mb-6 text-aksen">PANEL ADMIN</h1>
      <input type="text" id="auser" placeholder="Username" class="mb-3">
      <input type="password" id="apass" placeholder="Password" class="mb-4">
      <button onclick="masukAdmin()" class="w-full bg-aksen text-black font-bold py-3 rounded-xl tombol">MASUK</button>
      <p id="pesan" class="mt-3 text-center text-merah"></p>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="halDashboard" class="hidden p-4 max-w-7xl mx-auto">
    <div class="flex flex-wrap justify-between items-center mb-6">
      <h1 class="text-xl font-bold text-aksen">Panel Admin</h1>
      <button onclick="keluar()" class="bg-merah/20 text-merah px-4 py-2 rounded-xl tombol">KELUAR</button>
    </div>

    <!-- Tab Menu -->
    <div class="flex flex-wrap gap-2 mb-6">
      <button onclick="bukaTab('afiliator')" class="px-4 py-2 rounded-xl aktif-tab" id="tabAfiliator">Afiliator</button>
      <button onclick="bukaTab('transaksi')" class="px-4 py-2 rounded-xl bg-white/5" id="tabTransaksi">Transaksi Masuk</button>
      <button onclick="bukaTab('penarikan')" class="px-4 py-2 rounded-xl bg-white/5" id="tabPenarikan">Penarikan</button>
    </div>

    <!-- Kelola Afiliator -->
    <div id="tabAfiliatorHal" class="hal aktif">
      <div class="kartu p-5 mb-6">
        <h3 class="font-bold mb-3">Tambah Afiliator Baru</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <input type="text" id="u_user" placeholder="Username">
          <input type="password" id="u_pass" placeholder="Password">
          <input type="text" id="u_nama" placeholder="Nama Lengkap">
          <input type="tel" id="u_hp" placeholder="No HP">
        </div>
        <button onclick="tambahAfiliator()" class="mt-3 bg-hijau px-5 py-2 rounded-xl tombol">Tambah</button>
        <p id="pesanAfiliator" class="mt-2 text-sm"></p>
      </div>
      <div class="kartu p-5">
        <h3 class="font-bold mb-3">Daftar Afiliator</h3>
        <div id="daftarAfiliator" class="space-y-2"></div>
      </div>
    </div>

    <!-- Verifikasi Transaksi Masuk -->
    <div id="tabTransaksiHal" class="hal">
      <div class="kartu p-5 mb-6">
        <h3 class="font-bold mb-3">Tambah Transaksi Masuk</h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <input type="text" id="trx_idafiliasi" placeholder="ID Afiliasi (AF-xxx)">
          <input type="number" id="trx_nominal" placeholder="Nominal">
          <input type="text" id="trx_keterangan" placeholder="Keterangan">
        </div>
        <button onclick="tambahTransaksi()" class="mt-3 bg-aksen text-black px-5 py-2 rounded-xl tombol">Simpan</button>
      </div>
      <div class="kartu p-5">
        <h3 class="font-bold mb-3">Daftar Perlu Verifikasi</h3>
        <div id="daftarTransaksi" class="space-y-2"></div>
      </div>
    </div>

    <!-- Verifikasi Penarikan -->
    <div id="tabPenarikanHal" class="hal">
      <div class="kartu p-5">
        <h3 class="font-bold mb-3">Pengajuan Penarikan</h3>
        <div id="daftarPenarikan" class="space-y-2"></div>
      </div>
    </div>
  </div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw-4t6imSYIlSwTJqNfQ5rIVvPhKsDvPoqzUvNfiRR92bksT6LVda_ckIoTJJZPkWY4vg/exec"; // Ganti dengan URL yang sama
const SATU_BULAN = 30 * 24 * 60 * 60 * 1000;

window.onload = () => {
  const s = localStorage.getItem("sesiAdmin");
  if(s && Date.now() - JSON.parse(s).waktu < SATU_BULAN) masuk();
};

async function masukAdmin() {
  const u = document.getElementById("auser").value;
  const p = document.getElementById("apass").value;
  if(!u||!p) return pesan("Isi data!");
  
  const res = await fetch(SCRIPT_URL, {method:"POST", body:JSON.stringify({aksi:"loginAdmin", username:u, password:p})});
  const j = await res.json();
  if(j.sukses) {
    localStorage.setItem("sesiAdmin", JSON.stringify({waktu:Date.now(), nama:j.nama}));
    masuk();
  } else pesan("Login gagal");
}

function masuk() {
  document.getElementById("halLogin").classList.add("hidden");
  document.getElementById("halDashboard").classList.remove("hidden");
  muatSemua();
  setInterval(muatSemua, 8000);
}

function bukaTab(nama) {
  ["afiliator","transaksi","penarikan"].forEach(t=>{
    document.getElementById("tab"+t.charAt(0).toUpperCase()+t.slice(1)+"Hal").classList.toggle("aktif", t===nama);
    document.getElementById("tab"+t.charAt(0).toUpperCase()+t.slice(1)).classList.toggle("aktif-tab", t===nama);
    document.getElementById("tab"+t.charAt(0).toUpperCase()+t.slice(1)).classList.toggle("bg-white/5", t!==nama);
  });
}

async function muatSemua() {
  // Muat semua data
  const ss = await (await fetch(SCRIPT_URL, {method:"POST", body:JSON.stringify({aksi:"ambilData", id:""})})).json();
  // Untuk tampilan, ambil ulang data langsung dari sheet via script
  muatDaftarAfiliator();
  muatDaftarTransaksi();
  muatDaftarPenarikan();
}

async function muatDaftarAfiliator() {
  // Ambil data langsung dari sheet Pengguna
  const res = await fetch(SCRIPT_URL, {method:"POST", body:JSON.stringify({aksi:"ambilData", id:"DAFTAR_AFILIATOR"})});
  const j = await res.json();
  // Karena ambilData sederhana, gunakan alternatif: muat ulang dengan fungsi khusus
  const resp = await fetch(SCRIPT_URL, {method:"POST", body:JSON.stringify({aksi:"ambilData", id:"LIST_ALL"})});
  const data = await resp.json();
  // Sederhanakan: panggil fungsi yang mengembalikan semua daftar
  const tampil = await fetch(SCRIPT_URL, {method:"POST", body:JSON.stringify({aksi:"ambilData", id:"GET_ALL_USERS"})});
  const hasil = await tampil.json();
  // Karena kode script di atas belum ada fungsi GET_ALL_USERS, tambahkan di Apps Script:
  // Tambahkan di Apps Script:
  // case "GET_ALL_USERS": return balasan({sukses:true, data:ss.getSheetByName(SHEET_PENGGUNA).getDataRange().getValues()});
  
  // Tampilkan sementara
  const perintah = {aksi:"ambilData", id:"DAFTAR"};
  const r = await fetch(SCRIPT_URL, {method:"POST", body:JSON.stringify(perintah)});
  const jdata = await r.json();
  // Sementara ambil manual via fungsi yang sudah ada
  const daftarEl = document.getElementById("daftarAfiliator");
  daftarEl.innerHTML = "<p class='text-abu'>Data dimuat otomatis dari Google Sheets...</p>";
  
  // Versi lengkap: tambahkan fungsi berikut di Apps Script bagian switch:
  // case "daftarSemua": {
  //   const p = ss.getSheetByName(SHEET_PENGGUNA).getDataRange().getValues();
  //   const m = ss.getSheetByName(SHEET_MASUK).getDataRange().getValues();
  //   const t = ss.getSheetByName(SHEET_TARIK).getDataRange().getValues();
  //   return balasan({sukses:true, pengguna:p, masuk:m, tarik:t});
  // }
  
  // Setelah tambah fungsi di atas, gunakan kode berikut:
  const resSemua = await fetch(SCRIPT_URL, {method:"POST", body:JSON.stringify({aksi:"daftarSemua"})});
  const semua = await resSemua.json();
  if(!semua.sukses) return;
  
  let html = "";
  semua.pengguna.forEach((r,i) => {
    if(i===0) return; // lewati baris judul
    html += `<div class="kartu p-3 flex flex-col md:flex-row justify-between gap-2">
      <div>
        <p class="font-bold">${r[4]} — ${r[2]}</p>
        <p class="text-sm text-abu">${r[0]} • ${r[3]}</p>
        <p class="text-sm">Saldo: Rp${Number(r[7]).toLocaleString()} | Pending: Rp${Number(r[6]).toLocaleString()}</p>
      </div>
      <div class="flex gap-2 items-center">
        <button onclick="ubahStatus('${r[4]}','${r[5]==='aktif'?'nonaktif':'aktif'}')" 
          class="${r[5]==='aktif'?'bg-merah/20 text-merah':'bg-hijau/20 text-hijau'} px-3 py-1 rounded-lg text-sm tombol">
          ${r[5]==='aktif'?'Nonaktifkan':'Aktifkan'}
        </button>
      </div>
    </div>`;
  });
  daftarEl.innerHTML = html || "<p class='text-abu'>Belum ada afiliator</p>";
  
  // Tampilkan Transaksi Masuk
  let htmlTrx = "";
  semua.masuk.forEach((r,i)=>{
    if(i===0) return;
    if(r[4]==="menunggu") {
      htmlTrx += `<div class="kartu p-3 flex flex-col md:flex-row justify-between gap-2">
        <div>
          <p class="font-bold">${r[0]} — ${r[1]}</p>
          <p>Nominal: Rp${Number(r[2]).toLocaleString()}</p>
          <p class="text-sm text-abu">${r[3]}</p>
        </div>
        <div class="flex gap-2 items-center">
          <button onclick="verifikasiMasuk('${r[0]}','disetujui')" class="bg-hijau px-3 py-1 rounded-lg tombol">Setujui</button>
          <button onclick="verifikasiMasuk('${r[0]}','ditolak')" class="bg-merah px-3 py-1 rounded-lg tombol">Tolak</button>
        </div>
      </div>`;
    }
  });
  document.getElementById("daftarTransaksi").innerHTML = htmlTrx || "<p class='text-abu'>Tidak ada yang perlu verifikasi</p>";
  
  // Tampilkan Penarikan
  let htmlTarik = "";
  semua.tarik.forEach((r,i)=>{
    if(i===0) return;
    if(r[5]==="menunggu") {
      htmlTarik += `<div class="kartu p-3 flex flex-col md:flex-row justify-between gap-2">
        <div>
          <p class="font-bold">${r[0]} — ${r[1]}</p>
          <p>Nominal: Rp${Number(r[2]).toLocaleString()}</p>
          <p class="text-sm text-abu">${r[3]} — ${r[4]}</p>
        </div>
        <div class="flex gap-2 items-center">
          <button onclick="verifikasiTarik('${r[0]}','disetujui')" class="bg-hijau px-3 py-1 rounded-lg tombol">Setujui</button>
          <button onclick="verifikasiTarik('${r[0]}','ditolak')" class="bg-merah px-3 py-1 rounded-lg tombol">Tolak</button>
        </div>
      </div>`;
    }
  });
  
  document.getElementById("daftarPenarikan").innerHTML = htmlTarik || "<p class='text-abu'>Tidak ada pengajuan penarikan</p>";
}

async function tambahAfiliator() {
  const data = {
    aksi: "daftarAfiliator",
    username: document.getElementById("u_user").value.trim(),
    password: document.getElementById("u_pass").value,
    nama: document.getElementById("u_nama").value.trim(),
    no_hp: document.getElementById("u_hp").value.trim()
  };
  if (!data.username || !data.password || !data.nama || !data.no_hp) {
    document.getElementById("pesanAfiliator").textContent = "Lengkapi semua data!";
    document.getElementById("pesanAfiliator").className = "mt-2 text-sm text-merah";
    return;
  }

  const res = await fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify(data)
  });
  const j = await res.json();
  document.getElementById("pesanAfiliator").textContent = j.pesan || (j.sukses ? "Berhasil ditambahkan! ID: " + j.id : "Gagal");
  document.getElementById("pesanAfiliator").className = "mt-2 text-sm " + (j.sukses ? "text-hijau" : "text-merah");
  
  if (j.sukses) {
    document.getElementById("u_user").value = "";
    document.getElementById("u_pass").value = "";
    document.getElementById("u_nama").value = "";
    document.getElementById("u_hp").value = "";
    muatDaftarAfiliator();
  }
}

async function ubahStatus(id, statusBaru) {
  const res = await fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({
      aksi: "ubahStatusAfiliator",
      id: id,
      status: statusBaru === "aktif" ? "aktif" : "nonaktif"
    })
  });
  const j = await res.json();
  if (j.sukses) muatDaftarAfiliator();
}

async function tambahTransaksi() {
  const idAfiliasi = document.getElementById("trx_idafiliasi").value.trim();
  const nominal = parseInt(document.getElementById("trx_nominal").value);
  const keterangan = document.getElementById("trx_keterangan").value.trim();

  if (!idAfiliasi || !nominal || !keterangan) {
    alert("Lengkapi semua data!");
    return;
  }

  // Tambahkan fungsi ini di Apps Script bagian switch:
  // case "tambahTransaksiMasuk": {
  //   const sh = ss.getSheetByName(SHEET_MASUK);
  //   const id = "TRX-" + String(sh.getLastRow() + 1).padStart(3, "0");
  //   sh.appendRow([id, data.id_afiliasi, data.nominal, data.keterangan, "menunggu", new Date(), ""]);
  //   return balasan({sukses: true, id});
  // }

  const res = await fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({
      aksi: "tambahTransaksiMasuk",
      id_afiliasi: idAfiliasi,
      nominal: nominal,
      keterangan: keterangan
    })
  });
  const j = await res.json();
  
  if (j.sukses) {
    document.getElementById("trx_idafiliasi").value = "";
    document.getElementById("trx_nominal").value = "";
    document.getElementById("trx_keterangan").value = "";
    muatDaftarAfiliator();
  } else {
    alert("Gagal menyimpan transaksi");
  }
}

async function verifikasiMasuk(idTrx, status) {
  if (!confirm(`Yakin ingin ${status} transaksi ${idTrx}?`)) return;
  
  const res = await fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({
      aksi: "verifikasiMasuk",
      id_trx: idTrx,
      status: status
    })
  });
  const j = await res.json();
  if (j.sukses) muatDaftarAfiliator();
  else alert("Gagal memproses");
}

async function verifikasiTarik(idTarik, status) {
  if (!confirm(`Yakin ingin ${status} penarikan ${idTarik}?`)) return;
  
  const res = await fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({
      aksi: "verifikasiTarik",
      id_tarik: idTarik,
      status: status
    })
  });
  const j = await res.json();
  if (j.sukses) muatDaftarAfiliator();
  else alert("Gagal memproses");
}

function keluar() {
  localStorage.removeItem("sesiAdmin");
  location.reload();
}

function pesan(teks) {
  document.getElementById("pesan").textContent = teks;
}
</script>
</body>
</html>
