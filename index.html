<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TNXUS CLUB — Afiliasi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#165DFF',
            dark: '#0F172A',
            light: '#F8FAFC',
            success: '#10B981',
            warning: '#F59E0B',
            danger: '#EF4444'
          },
          fontFamily: { sans: ['Inter','system-ui','sans-serif'] }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto { content-visibility: auto; }
      .page { @apply pt-4 pb-24 px-4 max-w-2xl mx-auto; }
      .card { @apply bg-white rounded-2xl shadow-md p-4 mb-4 transition-all hover:shadow-lg; }
      .btn { @apply px-4 py-2.5 rounded-xl font-medium transition-all active:scale-95; }
      .btn-primary { @apply bg-primary text-white hover:bg-primary/90; }
      .btn-success { @apply bg-success text-white hover:bg-success/90; }
      .btn-danger { @apply bg-danger text-white hover:bg-danger/90; }
      .btn-outline { @apply border border-primary text-primary hover:bg-primary/5; }
      .input { @apply w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary/30; }
      .bottom-nav { @apply fixed bottom-0 left-0 right-0 bg-white border-t shadow-lg flex justify-around py-2 z-50; }
      .nav-item { @apply flex flex-col items-center text-gray-500 px-3 py-1.5 text-xs; }
      .nav-item.active { @apply text-primary font-medium; }
    }
  </style>
</head>
<body class="bg-slate-50 font-sans text-dark min-h-screen">
  <div id="app"></div>
  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzkzATwk2Qk6pXLZcFV0kvyaOdJ7CmNQvHRNP6P89vKMr6OEpn9h_dCqKjXGgObV5KcyQ/exec';
    const STORAGE_KEY = 'afiliasi_session';
    const SESSION_EXPIRE_DAY = 30;

    let state = { halaman:'login', user:null, data:null };
    let grafik = null;

    // Cek sesi
    function cekSesi() {
      const sesi = localStorage.getItem(STORAGE_KEY);
      if (!sesi) return false;
      const {user, loginAt} = JSON.parse(sesi);
      if (Date.now() - loginAt > SESSION_EXPIRE_DAY*86400000) {
        localStorage.removeItem(STORAGE_KEY);
        return false;
      }
      state.user = user;
      return true;
    }

    async function api(action, param={}) {
      const u = new URLSearchParams({action, ...param});
      const res = await fetch(SCRIPT_URL + '?' + u);
      return res.json();
    }

    function simpanSesi(user) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({user, loginAt:Date.now()}));
      state.user = user;
    }

    function keluar() {
      localStorage.removeItem(STORAGE_KEY);
      state = { halaman:'login', user:null, data:null };
      render();
    }

    // Halaman Login
    function renderLogin() {
      return `
      <div class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md">
          <div class="text-center mb-8">
            <h1 class="text-[clamp(1.5rem,4vw,2rem)] font-bold text-dark">TNXUS CLUB</h1>
            <p class="text-gray-500 mt-1">Sistem Afiliasi Resmi</p>
          </div>
          <div class="card">
            <h2 class="text-lg font-semibold mb-4">Masuk Akun</h2>
            <div id="pesan" class="text-red-500 text-sm mb-3"></div>
            <input type="text" id="username" placeholder="Username" class="input mb-3">
            <input type="password" id="password" placeholder="Password" class="input mb-4">
            <button onclick="prosesLogin()" class="btn btn-primary w-full">Masuk</button>
            <p class="text-center mt-4 text-sm text-gray-500">
              Belum punya akun? <a href="#" onclick="state.halaman='daftar';render()" class="text-primary font-medium">Daftar</a>
            </p>
          </div>
        </div>
      </div>`;
    }

    async function prosesLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const res = await api('login', {username, password});
      if (!res.sukses) return document.getElementById('pesan').textContent = res.pesan;
      simpanSesi(res.data);
      state.halaman = 'beranda';
      render();
    }

    // Halaman Daftar
    function renderDaftar() {
      return `
      <div class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md">
          <div class="text-center mb-6">
            <h1 class="text-xl font-bold">Daftar Afiliasi</h1>
          </div>
          <div class="card">
            <div id="pesanDaftar" class="text-red-500 text-sm mb-3"></div>
            <input type="text" id="nama" placeholder="Nama Lengkap" class="input mb-3">
            <input type="tel" id="no_hp" placeholder="Nomor HP" class="input mb-3">
            <input type="text" id="username" placeholder="Username" class="input mb-3">
            <input type="password" id="password" placeholder="Password" class="input mb-4">
            <button onclick="prosesDaftar()" class="btn btn-primary w-full">Kirim Pengajuan</button>
            <p class="text-center mt-4 text-sm text-gray-500">
              Sudah punya akun? <a href="#" onclick="state.halaman='login';render()" class="text-primary font-medium">Masuk</a>
            </p>
          </div>
        </div>
      </div>`;
    }

    async function prosesDaftar() {
      const nama = document.getElementById('nama').value.trim();
      const no_hp = document.getElementById('no_hp').value.trim();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const res = await api('daftar', {nama, no_hp, username, password});
      if (!res.sukses) return document.getElementById('pesanDaftar').textContent = res.pesan;
      alert(res.pesan);
      state.halaman = 'login'; render();
    }

    // Navigasi Bawah
    function nav() {
      return `
      <nav class="bottom-nav">
        <a href="#" onclick="state.halaman='beranda';render()" class="nav-item ${state.halaman==='beranda'?'active':''}">
          <i class="fa fa-home text-lg mb-0.5"></i> Beranda
        </a>
        <a href="#" onclick="state.halaman='saldo';render()" class="nav-item ${state.halaman==='saldo'?'active':''}">
          <i class="fa fa-wallet text-lg mb-0.5"></i> Saldo
        </a>
        <a href="#" onclick="state.halaman='akun';render()" class="nav-item ${state.halaman==='akun'?'active':''}">
          <i class="fa fa-user text-lg mb-0.5"></i> Akun
        </a>
      </nav>`;
    }

    // Halaman Beranda
    async function muatBeranda() {
      state.data = await api('getBeranda', {id_afiliasi:state.user.id_afiliasi});
      render();
    }

    function renderBeranda() {
      if (!state.data) muatBeranda();
      const d = state.data?.data || {saldo:{tersedia:0,pending:0}, transaksi:[], grafik:[]};
      return `
      <div class="page">
        <h2 class="text-xl font-bold mb-4">Halo, ${state.user.nama} 👋</h2>
        <!-- Banner Slider -->
        <div class="relative rounded-2xl overflow-hidden mb-4 bg-gray-100 aspect-[16/9]" id="banner">
          <div class="banner-slide active" style="background:linear-gradient(135deg,#165DFF,#4080FF);">
            <div class="p-6 text-white">
              <h3 class="text-lg font-bold">Bangun Pendapatan Pasif</h3>
              <p class="text-white/80 text-sm mt-1">Bagikan link, dapatkan komisi</p>
            </div>
          </div>
        </div>
        <!-- Saldo Card -->
        <div class="card bg-primary text-white">
          <p class="text-white/70 text-sm">Saldo Tersedia</p>
          <p class="text-2xl font-bold mt-1">Rp${Number(d.saldo?.tersedia||0).toLocaleString()}</p>
          <p class="text-white/70 text-sm mt-2">Saldo Pending: Rp${Number(d.saldo?.pending||0).toLocaleString()}</p>
          <button onclick="state.halaman='saldo';render()" class="mt-3 bg-white/20 hover:bg-white/30 btn text-white w-full">Tarik Saldo</button>
        </div>
        <!-- Grafik -->
        <div class="card">
          <h3 class="font-semibold mb-3">Pendapatan 30 Hari Terakhir</h3>
          <canvas id="grafik" height="200"></canvas>
        </div>
        <!-- Riwayat -->
        <div class="card">
          <h3 class="font-semibold mb-3">Transaksi Terbaru</h3>
          ${d.transaksi.length?d.transaksi.map(t=>`
            <div class="flex justify-between py-2 border-b last:border-0">
              <span class="${t.jenis==='masuk'?'text-success':'text-danger'}">${t.jenis==='masuk'?'+':'-'}Rp${Number(t.nominal).toLocaleString()}</span>
              <span class="text-xs text-gray-400">${t.status}</span>
            </div>`).join(''):'<p class="text-gray-400 text-sm">Belum ada transaksi</p>'}
        </div>
      </div>
      ${nav()}`;
    }

    // Halaman Saldo
    async function muatSaldo() {
      state.saldo = await api('getSaldo', {id_afiliasi:state.user.id_afiliasi});
      render();
    }

    function renderSaldo() {
      if (!state.saldo) muatSaldo();
      const d = state.saldo?.data || {tersedia:0, pending:0, trMasuk:[], trKeluar:[]};
      return `
      <div class="page">
        <h2 class="text-xl font-bold mb-4">Saldo & Penarikan</h2>
        <div class="grid grid-cols-2 gap-3 mb-4">
          <div class="card">
            <p class="text-gray-500 text-sm">Tersedia</p>
            <p class="font-bold text-lg mt-1">Rp${Number(d.tersedia||0).toLocaleString()}</p>
          </div>
          <div class="card">
            <p class="text-gray-500 text-sm">Pending</p>
            <p class="font-bold text-lg mt-1 text-warning">Rp${Number(d.pending||0).toLocaleString()}</p>
          </div>
        </div>
        <div class="card mb-6">
          <h3 class="font-semibold mb-3">Ajukan Penarikan</h3>
          <div id="pesanTarik" class="text-red-500 text-sm mb-2"></div>
          <input type="number" id="nominal" placeholder="Nominal (Min. 50.000)" class="input mb-3">
          <input type="text" id="bank" placeholder="Nama Bank / E-Wallet" class="input mb-3">
          <input type="text" id="tujuan" placeholder="Nomor Tujuan" class="input mb-4">
          <button onclick="prosesTarik()" class="btn btn-success w-full">Ajukan Penarikan</button>
        </div>
        <h3 class="font-semibold mb-3">Riwayat Masuk</h3>
        <div class="card mb-4">
          ${d.trMasuk.length?d.trMasuk.map(t=>`
            <div class="flex justify-between py-2 border-b last:border-0">
              <span class="text-success">+Rp${Number(t.nominal).toLocaleString()}</span>
              <span class="text-xs text-gray-400">${t.status}</span>
            </div>`).join(''):'<p class="text-gray-400 text-sm">Belum ada</p>'}
        </div>
        <h3 class="font-semibold mb-3">Riwayat Penarikan</h3>
        <div class="card">
          ${d.trKeluar.length?d.trKeluar.map(t=>`
            <div class="flex justify-between py-2 border-b last:border-0">
              <span class="text-danger">-Rp${Number(t.nominal).toLocaleString()}</span>
              <span class="text-xs text-gray-400">${t.status}</span>
            </div>`).join(''):'<p class="text-gray-400 text-sm">Belum ada</p>'}
        </div>
      </div>
      ${nav()}`;
    }

    async function prosesTarik() {
      const nominal = document.getElementById('nominal').value;
      const bank = document.getElementById('bank').value.trim();
      const tujuan = document.getElementById('tujuan').value.trim();
      const res = await api('ajukanTarik', {id_afiliasi:state.user.id_afiliasi, nominal, bank, norek:tujuan});
      if (!res.sukses) return document.getElementById('pesanTarik').textContent = res.pesan;
      alert(res.pesan); muatSaldo();
    }

    // Halaman Akun
    async function muatAkun() {
      state.akun = await api('getAkun', {id_afiliasi:state.user.id_afiliasi});
      render();
    }

    function renderAkun() {
      if (!state.akun) muatAkun();
      const d = state.akun?.data || {};
      return `
      <div class="page">
        <h2 class="text-xl font-bold mb-4">Data Akun</h2>
        <div class="card">
          <div class="flex justify-between py-2 border-b">
            <span class="text-gray-500">ID Afiliasi</span>
            <span class="font-medium">${d.id_afiliasi||'-'}</span>
          </div>
          <div class="flex justify-between py-2 border-b">
            <span class="text-gray-500">Nama</span>
            <span class="font-medium">${d.nama||'-'}</span>
          </div>
          <div class="flex justify-between py-2">
            <span class="text-gray-500">No. HP</span>
            <span class="font-medium">${d.no_hp||'-'}</span>
          </div>
        </div>
        <div class="card mt-4">
          <h3 class="font-semibold mb-2">Bantuan</h3>
          <p class="text-sm text-gray-500">Customer Service: <a href="https://wa.me/628123456789" class="text-primary">Kirim Pesan WA</a></p>
        </div>
        <div class="mt-6 space-y-3">
          <button onclick="keluar()" class="btn btn-outline w-full">Keluar</button>
          <button onclick="konfirmasiHapus()" class="btn btn-danger w-full">Hapus Akun Permanen</button>
        </div>
      </div>
      ${nav()}`;
    }

    async function konfirmasiHapus() {
      if (confirm('Apakah Anda yakin ingin menghapus akun secara permanen? Tindakan ini tidak dapat dibatalkan.')) {
        await api('hapusAkun', {id_afiliasi:state.user.id_afiliasi});
        keluar();
      }
    }

    // Render Utama
    function render() {
      const el = document.getElementById('app');
      if (!cekSesi()) {
        el.innerHTML = state.halaman==='daftar' ? renderDaftar() : renderLogin();
      } else {
        switch(state.halaman) {
          case 'saldo': el.innerHTML = renderSaldo(); break;
          case 'akun': el.innerHTML = renderAkun(); break;
          default: el.innerHTML = renderBeranda();
            setTimeout(()=>{
              if (state.data?.data?.grafik) buatGrafik(state.data.data.grafik);
            }, 100);
        }
      }
    }

    function buatGrafik(data) {
      const ctx = document.getElementById('grafik');
      if (!ctx) return;
      if (grafik) grafik.destroy();
      const lbl = Array(30).fill(0).map((_,i)=>i===29?'Hari Ini':`${30-i}h`);
      grafik = new Chart(ctx, {
        type:'line',
        data:{labels:lbl, datasets:[{label:'Pendapatan', data, borderColor:'#165DFF', backgroundColor:'rgba(22,93,255,0.1)', fill:true, tension:0.4}]},
        options:{responsive:true, plugins:{legend:{display:false}}, scales:{x:{display:false}, y:{beginAtZero:true}}}
      });
    }

    // Muat awal
    render();
    // Auto refresh tiap 30 detik
    setInterval(()=>{
      if (cekSesi() && state.halaman==='beranda') muatBeranda();
      if (cekSesi() && state.halaman==='saldo') muatSaldo();
    }, 30000);
  </script>
</body>
</html>
